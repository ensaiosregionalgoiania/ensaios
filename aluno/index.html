<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TÍTULO DA PÁGINA -->
    <title>Meu App Simples</title>
    
    <!-- CONFIGURAÇÕES PARA IPHONE -->
    
    <!-- Ícone que aparece na tela inicial do iPhone -->
    <link rel="apple-touch-icon" href="icone-180.png">
    
    <!-- Faz o site abrir em tela cheia (sem barra de endereços) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Cor da barra de status do iPhone (hora, bateria) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Nome que aparece abaixo do ícone na tela inicial -->
    <meta name="apple-mobile-web-app-title" content="Meu App">
    
    <!-- Para Android também (opcional) -->
    <link rel="manifest" href="/ensaios/temp/manifest.json">
    
    <!-- Favicon padrão para navegador -->
    <link rel="icon" type="image/png" href="logo-192.png">
    
</head>
<body>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        // Alert simples para testar
        alert("Olá, mundo! Bem-vindo ao meu app.");
        
        // Mensagem no console para debug
        console.log("App carregado com sucesso!");
    </script>
    
    <!-- TEXTO SIMPLES NA TELA (caso o alert não apareça) -->
    <h1>Meu App Simples</h1>
    <p>Se você está vendo isso, o alert deve ter aparecido.</p>
    
</body>
</html>
