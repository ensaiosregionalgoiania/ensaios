<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup - Sistema Ensaio Local</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* ESTILOS DO POPUP */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        .popup-container {
            background-color: white;
            border-radius: 15px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border-bottom: 2px solid #1c6ea4;
        }

        .popup-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0;
        }

        .popup-close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .popup-close-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .popup-content {
            padding: 5px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: calc(90vh - 130px);
            background-color: #f8f9fa;
        }

        .popup-image-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 8px;
            background: linear-gradient(145deg, #3498db15, #2980b915);
            border: 2px dashed #3498db;
            padding: 20px;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            color: #2c3e50;
            font-size: 1.2rem;
            line-height: 1.6;
            box-shadow: inset 0 0 20px rgba(52, 152, 219, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .popup-image-container:hover {
            border-color: #e74c3c;
            background: linear-gradient(145deg, #e74c3c15, #c0392b15);
            transform: scale(1.01);
            box-shadow: inset 0 0 30px rgba(231, 76, 60, 0.15);
        }

        .popup-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
            pointer-events: none; /* Impede que a imagem bloqueie o clique no container */
        }

        .popup-timer {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .timer-icon {
            font-size: 1.2rem;
        }

        .popup-footer {
            padding: 15px;
            text-align: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-size: 0.9rem;
            border-top: 2px solid #34495e;
        }

        .instructions-title {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        .instructions-list {
            list-style-type: none;
            padding-left: 0;
        }

        .instructions-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
        }

        .instructions-list li:before {
            content: "✓";
            color: #27ae60;
            font-weight: bold;
            margin-right: 10px;
            font-size: 1.2rem;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(-20px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from { 
                opacity: 1; 
                transform: translateY(0);
            }
            to { 
                opacity: 0; 
                transform: translateY(-20px);
                visibility: hidden;
            }
        }

        .popup-closing {
            animation: fadeOut 0.5s forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        .timer-paused {
            background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
            animation: none !important;
        }

        .image-switch-paused {
            border-color: #e74c3c !important;
            background: linear-gradient(145deg, #e74c3c20, #c0392b20) !important;
        }

        .pause-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 20;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: fadeInOut 2s infinite;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <!-- POPUP DE ENTRADA -->
    <div class="popup-overlay" id="popupEntrada">
        <div class="popup-container">
            <div class="popup-header">
                <h2 class="popup-title">🏛️Ensaio Regional</h2>
                <button class="popup-close-btn" id="btnFecharPopup">×</button>
            </div>
            <div class="popup-content">
                <div class="popup-image-container" id="imageContainer">
                    <img src="ensaio7.jpg" 
                         alt="Imagem do Sistema Ensaio Local" 
                         class="popup-image"
                         id="popupImage">
                </div>
            </div>
            <div class="popup-footer">
                <div class="popup-timer pulse-animation" id="popupTimer">
                    <span class="timer-icon">⏱️</span>
                    Fecha em: <span id="contadorSegundos">15</span> segundos
                </div>
            </div>
        </div>
    </div>

    <script>
        // VARIÁVEIS GLOBAIS
        let popupTimer;
        let imageSwitchTimer;
        let segundosRestantes = 10
        let popupFechado = false;
        let timerPausado = false;
        let imageSwitchPausado = false;
        let pausaTimer; // Timer para a pausa de 10 segundos
        let imagemIdAtual;
        let imageSwitchTimeout;

        const imagens = [
            'ensaio7.jpg',
            'ensaio8.jpg'
        ];

        // Inicializar popup quando a página carrega
        document.addEventListener('DOMContentLoaded', () => {
            inicializarPopup();
        });

        // Função para pausar o temporizador e a troca de imagens por 10 segundos
        function pausarTudo() {
            // Se já estiver pausado, não faz nada
            if (timerPausado && imageSwitchPausado) return;
            
            // Pausar timer
            if (!timerPausado) {
                clearInterval(popupTimer);
                timerPausado = true;
            }
            
            // Pausar troca de imagens
            if (!imageSwitchPausado) {
                clearTimeout(imageSwitchTimeout);
                imageSwitchPausado = true;
            }
            
            // Mudar aparência para indicar pausa
            const timerElement = document.getElementById('popupTimer');
            timerElement.classList.add('timer-paused');
            timerElement.classList.remove('pulse-animation');
            
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.classList.add('image-switch-paused');
            
            // Adicionar indicador visual de pausa
            //const pauseIndicator = document.createElement('div');
            //pauseIndicator.className = 'pause-indicator';
            //pauseIndicator.id = 'pauseIndicator';
            //pauseIndicator.textContent = '⏸️ PAUSADO - 10s';
            //imageContainer.appendChild(pauseIndicator);
            
            // Mostrar mensagem no timer
            timerElement.innerHTML = '<span class="timer-icon">⏸️</span> Pausado por 10s';
            
            console.log('Sistema pausado por 10 segundos');
            
            // Limpar pausa anterior se existir
            if (pausaTimer) {
                clearTimeout(pausaTimer);
            }
            
            // Configurar para retomar após 10 segundos
            pausaTimer = setTimeout(() => {
                retomarTudo();
            }, 10000);
        }

        // Função para retomar tudo
        function retomarTudo() {
            if (!timerPausado && !imageSwitchPausado) return;
            
            // Restaurar aparência
            const timerElement = document.getElementById('popupTimer');
            timerElement.classList.remove('timer-paused');
            timerElement.classList.add('pulse-animation');
            
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.classList.remove('image-switch-paused');
            
            // Remover indicador visual de pausa
            const pauseIndicator = document.getElementById('pauseIndicator');
            if (pauseIndicator) {
                pauseIndicator.remove();
            }
            
            // Restaurar timer
            timerElement.innerHTML = '<span class="timer-icon">⏱️</span> Fecha em: <span id="contadorSegundos">' + segundosRestantes + '</span> segundos';
            
            timerPausado = false;
            imageSwitchPausado = false;
            
            console.log('Sistema retomado. Segundos restantes:', segundosRestantes);
            
            // Reinicia o timer
            iniciarTimer();
            
            // Reinicia a troca de imagens
            agendarProximaTrocaImagem();
        }

        // Função para iniciar o timer
        function iniciarTimer() {
            if (popupTimer) {
                clearInterval(popupTimer);
            }
            
            popupTimer = setInterval(() => {
                // Não decrementa se estiver pausado
                if (timerPausado) return;
                
                segundosRestantes--;
                const contadorElemento = document.getElementById('contadorSegundos');
                if (contadorElemento) {
                    contadorElemento.textContent = segundosRestantes;
                }
                
                // Efeito visual quando faltam poucos segundos
                if (segundosRestantes <= 3) {
                    if (contadorElemento) {
                        contadorElemento.style.color = '#e74c3c';
                        contadorElemento.style.fontWeight = 'bold';
                    }
                    document.getElementById('popupTimer').classList.add('pulse-animation');
                }
                
                // Fechar automaticamente quando chegar a zero
                if (segundosRestantes <= 0) {
                    fecharPopup();
                }
            }, 1000);
        }

        // Função para agendar a próxima troca de imagem
        function agendarProximaTrocaImagem() {
            // Limpa o agendamento anterior se existir
            if (imageSwitchTimeout) {
                clearTimeout(imageSwitchTimeout);
            }
            
            // Se estiver pausado, não agenda nova troca
            if (imageSwitchPausado) return;
            
            // Agenda próxima troca para daqui a 5 segundos
            imageSwitchTimeout = setTimeout(() => {
                trocarImagem();
            }, 5000);
        }

        // Função para trocar a imagem
        function trocarImagem() {
            // Não troca se estiver pausado
            if (imageSwitchPausado) return;
            
            // Calcula próxima imagem
            imagemIdAtual = imagemIdAtual == imagens.length - 1 ? 0 : imagemIdAtual + 1;
            const proximaImagem = imagens[imagemIdAtual];
            
            // Efeito de fade
            const imagem = document.getElementById('popupImage');
            imagem.style.opacity = '0.5';
            imagem.style.transition = 'opacity 0.3s';
            
            setTimeout(() => {
                imagem.src = proximaImagem;
                
                setTimeout(() => {
                    imagem.style.opacity = '1';
                }, 100);
                
                console.log('Imagem trocada para:', proximaImagem);
            }, 300);
            
            // Agenda próxima troca
            agendarProximaTrocaImagem();
        }

        // Função para inicializar o popup
        function inicializarPopup() {
            const popup = document.getElementById('popupEntrada');
            const btnFechar = document.getElementById('btnFecharPopup');
            const imageContainer = document.getElementById('imageContainer');
            
            // Selecionar imagem aleatória inicial
            imagemIdAtual = Math.floor(Math.random() * imagens.length);
            document.getElementById('popupImage').src = imagens[imagemIdAtual];
            
            // Iniciar contador regressivo
            iniciarTimer();
            
            // Iniciar ciclo de troca de imagens
            agendarProximaTrocaImagem();
            
            // Evento para pausar tudo quando clicar na imagem
            imageContainer.addEventListener('click', () => {
                pausarTudo();
            });
            
            // Evento para fechar com botão
            btnFechar.addEventListener('click', () => {
                fecharPopup();
            });
            
            // Evento para fechar clicando fora do popup
            popup.addEventListener('click', (e) => {
                if (e.target === popup) {
                    fecharPopup();
                }
            });
            
            // Evento para fechar com tecla ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !popupFechado) {
                    e.preventDefault();
                    fecharPopup();
                }
            });
            
            // Impedir rolagem da página enquanto popup está aberto
            document.body.style.overflow = 'hidden';
        }

        // Função para fechar o popup
        function fecharPopup() {
            // Evitar múltiplos fechamentos
            if (popupFechado) return;
            popupFechado = true;
            
            // Limpar todos os timers
            clearInterval(popupTimer);
            clearTimeout(pausaTimer);
            clearTimeout(imageSwitchTimeout);
            
            const popup = document.getElementById('popupEntrada');
            
            // Adicionar animação de fechamento
            popup.classList.add('popup-closing');
            
            // Restaurar rolagem da página
            document.body.style.overflow = 'auto';
            
            setTimeout(() => {
                popup.style.display = 'none';
                console.log('Popup fechado. Para testar novamente, recarregue a página (F5).');
            }, 500);
            
            if (window.parent !== window) {
                window.parent.postMessage('FECHAR_POPUP', '*');
            }
        }

        // Função para reiniciar o popup (para testes)
        function reiniciarPopup() {
            const popup = document.getElementById('popupEntrada');
            
            // Resetar variáveis
            popupFechado = false;
            segundosRestantes = 10;
            timerPausado = false;
            imageSwitchPausado = false;
            
            // Limpar timers
            clearInterval(popupTimer);
            clearTimeout(pausaTimer);
            clearTimeout(imageSwitchTimeout);
            
            // Restaurar popup
            popup.style.display = 'flex';
            popup.classList.remove('popup-closing');
            popup.style.opacity = '1';
            popup.style.transform = 'translateY(0)';
            
            // Remover indicador de pausa se existir
            const pauseIndicator = document.getElementById('pauseIndicator');
            if (pauseIndicator) {
                pauseIndicator.remove();
            }
            
            // Resetar classes
            const timerElement = document.getElementById('popupTimer');
            timerElement.classList.remove('timer-paused');
            timerElement.classList.add('pulse-animation');
            
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.classList.remove('image-switch-paused');
            
            // Resetar timer visual
            timerElement.innerHTML = '<span class="timer-icon">⏱️</span> Fecha em: <span id="contadorSegundos">10</span> segundos';
            
            // Resetar contador visual
            const contadorElemento = document.getElementById('contadorSegundos');
            contadorElemento.textContent = '10';
            contadorElemento.style.color = '';
            contadorElemento.style.fontWeight = '';
            
            // Resetar imagem
            imagemIdAtual = Math.floor(Math.random() * imagens.length);
            document.getElementById('popupImage').src = imagens[imagemIdAtual];
            document.getElementById('popupImage').style.opacity = '1';
            
            // Bloquear rolagem novamente
            document.body.style.overflow = 'hidden';
            
            // Reiniciar timer e troca de imagens
            iniciarTimer();
            agendarProximaTrocaImagem();
            
            console.log('Popup reiniciado para testes');
        }

        // Adicionar botão de teste (apenas para desenvolvimento)
        if (window.location.href.includes('localhost') || window.location.href.includes('127.0.0.1')) {
            setTimeout(() => {
                const testeBtn = document.createElement('button');
                testeBtn.textContent = '🔄 Testar Popup Novamente';
                testeBtn.style.position = 'fixed';
                testeBtn.style.bottom = '20px';
                testeBtn.style.left = '20px';
                testeBtn.style.padding = '10px 15px';
                testeBtn.style.background = '#3498db';
                testeBtn.style.color = 'white';
                testeBtn.style.border = 'none';
                testeBtn.style.borderRadius = '5px';
                testeBtn.style.cursor = 'pointer';
                testeBtn.style.zIndex = '10000';
                testeBtn.onclick = reiniciarPopup;
                
                document.body.appendChild(testeBtn);
            }, 2000);
        }
    </script>
</body>
</html>
