    <style>

        textarea {

        .modal {
            display: none;

            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);

            color: #aaa;
            float: right;

            font-weight: bold;

        }
        .modal-actions {

            margin-top: 20px;
        }
        .modal-actions button {

        }
        .editable-cell {
            cursor: pointer;
            position: relative;
        }
        .editable-cell input {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border: none;
            padding: 8px;
            box-sizing: border-box;
            display: none;
        }
        .editable-cell.editing {
            padding: 0;
        }
        .editable-cell.editing .cell-value {
            display: none;
        }
        .editable-cell.editing input {
            display: block;
        }
        .dsst-select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: none;
        }
        .add-organist-btn {
            background-color: #2ecc71;
            margin-top: 10px;
        }
        .add-organist-btn:hover {
            background-color: #27ae60;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            .modal, .modal * {
                visibility: visible;
            }
            .modal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: auto;
                background-color: white;
            }
            .modal-actions {
                display: none;
            }
            .next-service {
                background-color: #fffacd !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .adjusted-organist {
                color: #e74c3c !important;
            }
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .left-panel, .right-panel {
                width: 100%;
            }
            .action-buttons {
                flex-direction: column;
            }
        }
        .priority-cell {
           background-color: #e6f7ff !important;
           border: 2px solid #1890ff !important;
           font-weight: bold;
        }

    position: absolute;
    z-index: 100;
    background: white;
    border: 1px solid #ccc;
    max-height: 200px;
    overflow-y: auto;
    display: none;

}

}

.day-checkboxes label {

        <div class="right-panel">
            <h2>Gerar Rodízio</h2>

                <label for="startDate">Data Inicial:</label>

    <div id="scheduleModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="text-align: center;">Rodízio de Organistas</h2>
            <div id="modalScheduleView"></div>
            <div class="modal-actions">
                <button onclick="window.print()">Imprimir</button>
                <button onclick="closeModal()">Fechar</button>
            </div>
        </div>

    <script>
        // Variável global para armazenar as organistas
        let organists = [];
        let currentSchedule = {};
        let nextServiceDate = null;
        let priorityOrganists = {
              mh: null,
              co: null,
              rjm: null
        };
        
        // Inicializa a página
        document.addEventListener('DOMContentLoaded', function() {
            renderOrganistsTable();
            setDefaultStartDate(); // Esta linha já deve existir
        });
        // Gera CSV a partir dos dados atuais
        function generateCSV() {
            return organists.map(org => {
                return [
                    org.name,
                    org.mhOrder !== null ? org.mhOrder : '',
                    org.coOrder !== null ? org.coOrder : '',
                    org.parceira !== null ? `"${org.parceira}"` : '',
                    org.rjmOrder !== null ? org.rjmOrder : '',
                    org.dsst !== null ? org.dsst : '',
                    org.idtst !== null ? org.idtst : '',
                    org.fdtst !== null ? org.fdtst : ''
                ].join(',');
            }).join('\n');
        }

        // Exporta dados para CSV
        function exportOrganists() {
            const csvData = generateCSV();
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'organistas_ccb.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Importa organistas da textarea
        function importOrganists() {
    try {
        const csvData = document.getElementById('organistsData').value.trim();
        if (!csvData) {
            alert('Nenhum dado para importar!');
            return;
        }

        const lines = csvData.split('\n');
        organists = []; // Limpa a lista atual
        
        lines.forEach(line => {
            line = line.trim();
            if (!line) return;
            
            // Processa a linha CSV (mantém a lógica original)
            const cells = line.split(',').map(cell => {
                cell = cell.trim();
                if (cell.startsWith('"') && cell.endsWith('"')) {
                    return cell.slice(1, -1);
                }
                return cell === '' ? null : cell;
            });
            
            organists.push({
                name: cells[0],
                mhOrder: cells[1] ? parseInt(cells[1]) : null,
                coOrder: cells[2] ? parseInt(cells[2]) : null,
                parceira: cells[3] || null,
                rjmOrder: cells[4] ? parseInt(cells[4]) : null,
                dsst: cells[5] ? parseInt(cells[5]) : null,
                idtst: cells[6] || null,
                fdtst: cells[7] || null
            });
        });
        
        renderOrganistsTable();
        alert(`Dados importados com sucesso! ${organists.length} organistas cadastradas.`);
    } catch (error) {
        alert('Erro ao importar dados: ' + error.message);
        console.error(error);
    }
}
        // Atualiza os combobox de seleção de organistas
        // Define a data inicial como primeiro dia do próximo mês
        function setDefaultStartDate() {
            const today = new Date();
            const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
    
            // Formata a data como YYYY-MM-DD para o input type="date"
            const formattedDate = nextMonth.toISOString().split('T')[0];
            document.getElementById('startDate').value = formattedDate;
        }
        // Renderiza a tabela de organistas com células editáveis
        function renderOrganistsTable() {
    const tbody = document.querySelector('#organistsTable tbody');
    tbody.innerHTML = '';
    
    organists.sort((a, b) => {
        const aCO = a.coOrder === null ? 999 : a.coOrder;
        const bCO = b.coOrder === null ? 999 : b.coOrder;
        return aCO - bCO || (a.mhOrder || 999) - (b.mhOrder || 999);
    });
    
    organists.forEach((org, index) => {
        const row = document.createElement('tr');
        const isPriorityMH = org.name === priorityOrganists.mh;
        const isPriorityCO = org.name === priorityOrganists.co;
        const isPriorityRJM = org.name === priorityOrganists.rjm;

        row.innerHTML = `
            <td class="editable-cell" data-field="name">
                <span class="cell-value">${org.name}</span>
                <input type="text" value="${org.name}">
            </td>
            <td class="editable-cell" data-field="mhOrder">
                <span class="cell-value ${isPriorityMH ? 'priority-cell' : ''}">${org.mhOrder === null ? '' : org.mhOrder}</span>
            </td>
            <td class="editable-cell" data-field="coOrder">
                <span class="cell-value ${isPriorityCO ? 'priority-cell' : ''}">${org.coOrder === null ? '' : org.coOrder}</span>
            </td>
            <td class="editable-cell" data-field="parceira">
                <span class="cell-value">${org.parceira || ''}</span>
                <input type="text" value="${org.parceira || ''}">
            </td>
            <td class="editable-cell" data-field="rjmOrder">
                <span class="cell-value ${isPriorityRJM ? 'priority-cell' : ''}">${org.rjmOrder === null ? '' : org.rjmOrder}</span>
            </td>
            <td class="editable-cell" data-field="dsst">
                <span class="cell-value">${org.dsst === null ? '' : getDayName(org.dsst)}</span>
                <select class="dsst-select">
                    <option value="">Dia sem tocar</option>
                    <option value="0" ${org.dsst === 0 ? 'selected' : ''}>Domingo</option>
                    <option value="3" ${org.dsst === 3 ? 'selected' : ''}>Quarta</option>
                    <option value="6" ${org.dsst === 6 ? 'selected' : ''}>Sábado</option>
                </select>
            </td>
            <td class="editable-cell" data-field="idtst">
                <span class="cell-value">${org.idtst || ''}</span>
                <input type="text" value="${org.idtst || ''}" placeholder="dd/mm/aaaa">
            </td>
            <td class="editable-cell" data-field="fdtst">
                <span class="cell-value">${org.fdtst || ''}</span>
                <input type="text" value="${org.fdtst || ''}" placeholder="dd/mm/aaaa">
            </td>
        `;
        
        tbody.appendChild(row);
    });
    
    setupEditableCells();
}
        // Configura os eventos para as células editáveis
        function setupEditableCells() {
    // Configura células normais (nome, parceira, datas)
    document.querySelectorAll('.editable-cell:not([data-field$="Order"])').forEach(cell => {
        cell.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (this.classList.contains('editing')) return;
            
            this.classList.add('editing');
            const input = this.querySelector('input, select');
            if (input) {
                input.focus();
                if (input.tagName === 'SELECT') {
                    input.style.display = 'block';
                }
            }
        });
        
        const input = cell.querySelector('input');
        const select = cell.querySelector('select');
        
        if (input) {
            input.addEventListener('blur', function() { saveCellEdit(cell); });
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') saveCellEdit(cell);
            });
        }
        
        if (select) {
            select.addEventListener('blur', function() { saveCellEdit(cell); });
            select.addEventListener('change', function() { saveCellEdit(cell); });
        }
    });
    
    // Configura células de ordem (MH, CO, RJM) com dropdown
    document.querySelectorAll('.editable-cell[data-field$="Order"]').forEach(cell => {
        // Cria o dropdown
        const select = document.createElement('div');
        select.className = 'order-select';
        
        // Adiciona opções de 1 a 20
        for (let i = 1; i <= 20; i++) {
            const option = document.createElement('div');
            option.className = 'order-option';
            option.textContent = i;
            option.dataset.value = i;
            select.appendChild(option);
        }
        
        // Adiciona opção "Início"
        const inicioOption = document.createElement('div');
        inicioOption.className = 'order-option inicio';
        inicioOption.textContent = 'Início';
        inicioOption.dataset.value = '0';
        select.appendChild(inicioOption);
        
        cell.appendChild(select);
        cell.style.position = 'relative';

        // Clicar na célula para mostrar o dropdown
        cell.addEventListener('click', function(e) {
            if (e.target.classList.contains('order-option')) return;
            
            // Esconde todos os outros dropdowns
            document.querySelectorAll('.order-select').forEach(s => {
                s.classList.remove('show');
            });
            
            // Mostra este dropdown
            select.classList.add('show');
            e.stopPropagation();
        });

        // Selecionar uma opção
        select.addEventListener('click', function(e) {
            if (e.target.classList.contains('order-option')) {
                const value = e.target.dataset.value;
                const field = cell.getAttribute('data-field').replace('Order', ''); // 'mh', 'co' ou 'rjm'
                const row = cell.parentNode;
                const rowIndex = Array.from(row.parentNode.children).indexOf(row);
                
                if (value === '0') {
                    // Apenas marca como prioritária (não altera a ordem)
                    priorityOrganists[field] = organists[rowIndex].name;
                } else {
                    // Atualiza o valor numérico normal
                    organists[rowIndex][`${field}Order`] = parseInt(value);
                    // Se estava marcada como prioritária, desmarca
                    if (priorityOrganists[field] === organists[rowIndex].name) {
                        priorityOrganists[field] = null;
                    }
                }
                
                select.classList.remove('show');
                renderOrganistsTable();
            }
        });
    });

    // Fechar dropdown ao clicar fora
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.editable-cell[data-field$="Order"]')) {
            document.querySelectorAll('.order-select').forEach(s => {
                s.classList.remove('show');
            });
        }
    });
}
        // Salva a edição de uma célula
        function saveCellEdit(cell) {
            const row = cell.parentNode;
            const rowIndex = Array.from(row.parentNode.children).indexOf(row);
            const field = cell.getAttribute('data-field');
            let value;
            
            const input = cell.querySelector('input');
            const select = cell.querySelector('select');
            
            if (input) {
                value = input.value.trim();
                
                // Conversão para números quando aplicável
                if (field === 'mhOrder' || field === 'coOrder' || field === 'rjmOrder') {
                    value = value === '' ? null : parseInt(value);
                }
                
                // Para campos de data, verifica o formato
                if ((field === 'idtst' || field === 'fdtst') && value !== '' && !isValidDate(value)) {
                    alert('Formato de data inválido. Use dd/mm/aaaa');
                    return;
                }
            } else if (select) {
                value = select.value === '' ? null : parseInt(select.value);
            }
            
            // Atualiza o objeto organista
            organists[rowIndex][field] = value;
            
            // Atualiza o valor exibido
            const cellValue = cell.querySelector('.cell-value');
            if (field === 'dsst') {
                cellValue.textContent = value === null ? '' : getDayName(value);
            } else {
                cellValue.textContent = value === null ? '' : value;
            }
            
            // Sai do modo edição
            cell.classList.remove('editing');
            if (select) select.style.display = 'none';
            
            // Atualiza os selects de organistas
            //updateOrganistSelections();
        }

        // Valida o formato da data
        function isValidDate(dateString) {
           return /^\d{2}\/\d{2}\/\d{4}$/.test(dateString);
        }
        // Adiciona uma nova organista
        function addNewOrganist() {
            organists.push({
                name: "Nova Organista",
                mhOrder: null,
                coOrder: null,
                parceira: null,
                rjmOrder: null,
                dsst: null,
                idtst: null,
                fdtst: null
            });
            
            renderOrganistsTable();
            
            // Rola até a última linha e inicia a edição do nome
            const lastRow = document.querySelector('#organistsTable tbody tr:last-child');
            const nameCell = lastRow.querySelector('td[data-field="name"]');
            nameCell.click();
        }

        // Gera o rodízio a partir dos dados da tabela

        function generateSchedule() {
    // 1. OBTER E VALIDAR DADOS DE ENTRADA
    const startDateInput = document.getElementById('startDate').value;
    const [year, month, day] = startDateInput.split('-').map(Number);
    const startDate = new Date(year, month - 1, day); // Mês é 0-based
    
    const months = parseInt(document.getElementById('months').value);
    
    if (isNaN(startDate.getTime())) {
        alert('Por favor, selecione uma data válida');
        return;
    }

    // 2. OBTER DIAS SELECIONADOS
    const selectedDays = [];
    document.querySelectorAll('.day-checkbox:checked').forEach(checkbox => {
        selectedDays.push(parseInt(checkbox.value));
    });
    
    if (selectedDays.length === 0) {
        alert('Selecione pelo menos um dia de culto');
        return;
    }

    // 3. CALCULAR PERÍODO CORRETO (DATA INICIAL EXATA + MESES)
    const endDate = new Date(
        startDate.getFullYear(),
        startDate.getMonth() + months,
        0 // Último dia do mês final
    );

    // 4. PREPARAR LISTAS DE ORGANISTAS
    const getOrderedOrganists = (organists, orderField, priorityName) => {
        if (!priorityName) return organists.sort((a, b) => a[orderField] - b[orderField]);
        
        const priorityOrg = organists.find(org => org.name === priorityName);
        if (!priorityOrg) return organists.sort((a, b) => a[orderField] - b[orderField]);
        
        const sortedOrganists = organists.filter(org => org[orderField] !== null)
                                     .sort((a, b) => a[orderField] - b[orderField]);
        const priorityIndex = sortedOrganists.findIndex(org => org.name === priorityName);
        
        return [...sortedOrganists.slice(priorityIndex), ...sortedOrganists.slice(0, priorityIndex)];
    };
    
    let mhOrganists = getOrderedOrganists(
        organists.filter(org => org.mhOrder !== null),
        'mhOrder',
        priorityOrganists.mh
    ).map(org => ({...org}));
        
    let coOrganists = getOrderedOrganists(
        organists.filter(org => org.coOrder !== null),
        'coOrder',
        priorityOrganists.co
    ).map(org => ({...org}));

    let rjmOrganists = getOrderedOrganists(
        organists.filter(org => org.rjmOrder !== null),
        'rjmOrder',
        priorityOrganists.rjm
    ).map(org => ({...org}));

    // 5. GERAR RODÍZIO DIA A DIA
    const scheduleByMonth = {};
    let currentDate = new Date(startDate);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    nextServiceDate = null;
    
    let currentMhIndex = 0;
    let currentCoIndex = 0;
    let currentRjmIndex = 0;
    const skippedOrganists = { mh: null, co: null, rjm: null };
    
    while (currentDate <= endDate) {
        const dayOfWeek = currentDate.getDay();
        const isSunday = dayOfWeek === 0;
        const isSelectedDay = selectedDays.includes(dayOfWeek);
        
        if (isSelectedDay || isSunday) {
            const dateCopy = new Date(currentDate);
            const monthYear = `${getMonthName(currentDate.getMonth())}/${currentDate.getFullYear()}`;
            const day = currentDate.getDate();
            const dayName = getDayName(dayOfWeek);
            let adjusted = false;
            let adjustedPeriod = false;
            
            if (!nextServiceDate && dateCopy >= today) {
                nextServiceDate = new Date(dateCopy);
            }

            let mhDisplay = '';
            let coDisplay = '';
            let rjmDisplay = '';

            // LÓGICA PARA DIAS SELECIONADOS (NÃO DOMINGO OU DOMINGO SELECIONADO)
            if (isSelectedDay) {
                // CULTO OFICIAL
                let coOrganist = skippedOrganists.co || coOrganists[currentCoIndex % coOrganists.length];
                let coSkipped = false;
                coDisplay = coOrganist.name;
                
                const isInactivePeriod = coOrganist.idtst && coOrganist.fdtst && 
                                      isDateInPeriod(dateCopy, coOrganist.idtst, coOrganist.fdtst);

                if (coOrganist.dsst === dayOfWeek || isInactivePeriod) {
                    skippedOrganists.co = coOrganist;
                    coOrganist = coOrganists[(currentCoIndex + 1) % coOrganists.length];
                    coDisplay = isInactivePeriod ? `${coOrganist.name}` : `${coOrganist.name}**`;
                    currentCoIndex++;
                    coSkipped = true;
                    adjusted = true;
                    if (isInactivePeriod) adjustedPeriod = true;
                } else {
                    skippedOrganists.co = null;
                }
                
                // MEIA HORA
                let mhOrganist = skippedOrganists.mh || mhOrganists[currentMhIndex % mhOrganists.length];
                const isMhInactive = mhOrganist.idtst && mhOrganist.fdtst && 
                                   isDateInPeriod(dateCopy, mhOrganist.idtst, mhOrganist.fdtst);

                if (mhOrganist.dsst === dayOfWeek || isMhInactive) {
                    skippedOrganists.mh = mhOrganist;
                    mhOrganist = mhOrganists[(currentMhIndex + 1) % mhOrganists.length];
                    if (isMhInactive) adjustedPeriod = true;
                    adjusted = true;
                } else {
                    skippedOrganists.mh = null;
                }
                
                mhDisplay = coOrganist.parceira || mhOrganist.name;
                if (!coOrganist.parceira) {
                    if (mhDisplay === coOrganist.name) {
                        mhOrganist = mhOrganists[(currentMhIndex + 1) % mhOrganists.length];
                        mhDisplay = mhOrganist.name;
                        currentMhIndex++;
                    }
                    if (mhOrganist.dsst === dayOfWeek) {
                        mhDisplay = `${mhDisplay}**`;
                        adjusted = true;
                    }
                    currentMhIndex++;
                }
                
                if (!coSkipped) {
                    currentCoIndex++;
                }
            }
            
            // RJM (SEMPRE AOS DOMINGOS, MESMO NÃO SELECIONADO)
            if (isSunday && rjmOrganists.length > 0) {
                let rjmOrganist = skippedOrganists.rjm || rjmOrganists[currentRjmIndex % rjmOrganists.length];
                const isRjmInactive = rjmOrganist.idtst && rjmOrganist.fdtst && 
                                     isDateInPeriod(dateCopy, rjmOrganist.idtst, rjmOrganist.fdtst);
                
                if (rjmOrganist.dsst === dayOfWeek || isRjmInactive) {
                    skippedOrganists.rjm = rjmOrganist;
                    rjmOrganist = rjmOrganists[(currentRjmIndex + 1) % rjmOrganists.length];
                    rjmDisplay = isRjmInactive ? `${rjmOrganist.name}` : `${rjmOrganist.name}**`;
                    adjusted = true;
                    if (isRjmInactive) adjustedPeriod = true;
                } else {
                    skippedOrganists.rjm = null;
                    rjmDisplay = rjmOrganist.name;
                }
                currentRjmIndex++;
            }
            
            // ADICIONAR À GRADE
            if (!scheduleByMonth[monthYear]) {
                scheduleByMonth[monthYear] = [];
            }
            
            if (rjmDisplay || isSelectedDay) {
                scheduleByMonth[monthYear].push({ 
                    date: dateCopy,
                    day, 
                    dayName,
                    mh: mhDisplay,
                    co: coDisplay,
                    rjm: rjmDisplay,
                    isNextService: nextServiceDate && dateCopy.getTime() === nextServiceDate.getTime(),
                    isAdjusted: adjusted,
                    isAdjustedPeriod: adjustedPeriod
                });
            }
        }
        currentDate.setDate(currentDate.getDate() + 1);
    }
    
    // 6. ATUALIZAR VISUALIZAÇÃO
    currentSchedule = scheduleByMonth;
    updateScheduleView(scheduleByMonth);
    updateModalScheduleView(scheduleByMonth);
}

// Função auxiliar para verificar se a data está no período
        function isDateInPeriod(date, startDateStr, endDateStr) {
            const startDateParts = startDateStr.split('/');
            const endDateParts = endDateStr.split('/');
            
            const startDate = new Date(startDateParts[2], startDateParts[1] - 1, startDateParts[0]);
            const endDate = new Date(endDateParts[2], endDateParts[1] - 1, endDateParts[0]);
            const checkDate = new Date(date);
            
            // Remove horas para comparar apenas as datas
            startDate.setHours(0, 0, 0, 0);
            endDate.setHours(0, 0, 0, 0);
            checkDate.setHours(0, 0, 0, 0);
            
            return checkDate >= startDate && checkDate <= endDate;
        }

        // Atualiza a visualização principal
        function updateScheduleView(scheduleByMonth) {
            const container = document.getElementById('schedule-view');
            container.innerHTML = '';
            
            if (Object.keys(scheduleByMonth).length === 0) {
                container.innerHTML = '<p>Gere o rodízio para visualizar os meses aqui.</p>';
                return;
            }
            
            Object.entries(scheduleByMonth).forEach(([monthYear, schedule]) => {
                const monthDiv = document.createElement('div');
                monthDiv.className = 'schedule-month';
                
                let tableHTML = `
                    <table>
                        <tr><th colspan="5" class="month-header">${monthYear}</th></tr>
                        <tr>
                            <th>Dia</th>
                            <th>Dia Semana</th>
                            <th>Meia Hora</th>
                            <th>Culto Oficial</th>
                            <th>RJM</th>
                        </tr>
                `;
                
                schedule.forEach(item => {
                    const rowClass = item.isNextService ? 'next-service' : '';
                    const mhClass = item.mh.includes('**') ? 'adjusted-organist' : '';
                    const coClass = item.co.includes('**') ? 'adjusted-organist' : '';
                    const rjmClass = item.rjm.includes('**') ? 'adjusted-organist' : '';
                    
                    tableHTML += `
        <tr class="${rowClass}">
            <td>${String(item.day).padStart(2, '0')}${item.isAdjustedPeriod ? '***' : ''}</td>
            <td>${item.dayName}</td>
            <td class="${mhClass} ${item.mhPriority ? 'priority-cell' : ''}">${item.mh}</td>
            <td class="${coClass} ${item.coPriority ? 'priority-cell' : ''}">${item.co}</td>
            <td class="${rjmClass} ${item.rjmPriority ? 'priority-cell' : ''}">${item.rjm || ''}</td>
        </tr>
    `;
});                
                tableHTML += `</table>`;
                monthDiv.innerHTML = tableHTML;
                container.appendChild(monthDiv);
            });
        }

        // Atualiza a visualização no modal
        function updateModalScheduleView(scheduleByMonth) {
            const container = document.getElementById('modalScheduleView');
            container.innerHTML = '';
            
            if (Object.keys(scheduleByMonth).length === 0) {
                container.innerHTML = '<p>Nenhum rodízio gerado ainda.</p>';
                return;
            }
            
            Object.entries(scheduleByMonth).forEach(([monthYear, schedule]) => {
                const monthDiv = document.createElement('div');
                monthDiv.className = 'schedule-month';
                monthDiv.style.marginBottom = '30px';
                
                let tableHTML = `
                    <h3 style="background-color: #2c3e50; color: white; padding: 8px; text-align: center;">
                        ${monthYear}
                    </h3>
                    <table style="width: 100%;">
                        <tr>
                            <th>Dia</th>
                            <th>Dia Semana</th>
                            <th>Meia Hora</th>
                            <th>Culto Oficial</th>
                            <th>RJM</th>
                        </tr>
                `;
                
                schedule.forEach(item => {
                    const rowStyle = item.isNextService ? 'background-color: #fffacd; font-weight: bold;' : '';
                    const mhStyle = item.mh.includes('**') ? 'color: #e74c3c; font-weight: bold;' : '';
                    const coStyle = item.co.includes('**') ? 'color: #e74c3c; font-weight: bold;' : '';
                    const rjmStyle = item.rjm.includes('**') ? 'color: #e74c3c; font-weight: bold;' : '';
                    
                    tableHTML += `
                        <tr style="${rowStyle}">
                            <td>${String(item.day).padStart(2, '0')}${item.isAdjustedPeriod ? '***' : ''}</td>
                            <td>${item.dayName}</td>
                            <td style="${mhStyle}">${item.mh}</td>
                            <td style="${coStyle}">${item.co}</td>
                            <td style="${rjmStyle}">${item.rjm || ''}</td>
                        </tr>
                    `;
                });
                
                tableHTML += `</table>`;
                monthDiv.innerHTML = tableHTML;
                container.appendChild(monthDiv);
            });
        }

        // Controla o modal
        function openScheduleModal() {
            if (Object.keys(currentSchedule).length === 0) {
                alert('Por favor, gere o rodízio primeiro');
                return;
            }
            document.getElementById('scheduleModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('scheduleModal').style.display = 'none';
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('scheduleModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Funções auxiliares
        function getMonthName(monthIndex) {
            const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                          'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            return months[monthIndex];
        }

        function getDayName(dayIndex) {
           const days = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
           return days[dayIndex];
        }

// Configura o evento para o input de arquivo
document.getElementById('fileInput').addEventListener('change', handleFileSelect);

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    
    reader.onload = function(e) {
        try {
            const contents = e.target.result;
            
            // Processa o conteúdo exatamente como na importação normal
            const lines = contents.split('\n');
            organists = []; // Limpa a lista atual
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                // Processa a linha CSV (mesma lógica do botão Importar)
                const cells = line.split(',').map(cell => {
                    cell = cell.trim();
                    if (cell.startsWith('"') && cell.endsWith('"')) {
                        return cell.slice(1, -1);
                    }
                    return cell === '' ? null : cell;
                });
                
                organists.push({
                    name: cells[0],
                    mhOrder: cells[1] ? parseInt(cells[1]) : null,
                    coOrder: cells[2] ? parseInt(cells[2]) : null,
                    parceira: cells[3] || null,
                    rjmOrder: cells[4] ? parseInt(cells[4]) : null,
                    dsst: cells[5] ? parseInt(cells[5]) : null,
                    idtst: cells[6] || null,
                    fdtst: cells[7] || null
                });
            });
            
            // Atualiza a textarea e a tabela (igual ao botão Importar)
            document.getElementById('organistsData').value = contents;
            renderOrganistsTable();
            alert(`Dados importados com sucesso do arquivo! ${organists.length} organistas cadastradas.`);
        } catch (error) {
            alert('Erro ao importar dados do arquivo: ' + error.message);
            console.error(error);
        }
    };
    
    reader.onerror = function() {
        alert('Erro ao ler o arquivo');
    };
    
    reader.readAsText(file);
    
    // Limpa o input para permitir nova seleção do mesmo arquivo
    event.target.value = '';
}

async function exportToTxt() {
    const content = organists.map(org => {
        return [
            org.name,
            org.mhOrder !== null ? org.mhOrder : '',
            org.coOrder !== null ? org.coOrder : '',
            org.parceira ? `"${org.parceira}"` : '',
            org.rjmOrder !== null ? org.rjmOrder : '',
            org.dsst !== null ? org.dsst : '',
            org.idtst || '',
            org.fdtst || ''
        ].join(',');
    }).join('\n');

    // Verifica se a API moderna está disponível
    if ('showSaveFilePicker' in window) {
        try {
            const dateStr = new Date().toISOString().replace(/[:.]/g, '-');
            const suggestedName = `organistas-ccb-${dateStr.slice(0, 19)}.txt`;
            
            const handle = await window.showSaveFilePicker({
                suggestedName: suggestedName,
                types: [{
                    description: 'Arquivos de Texto',
                    accept: {'text/plain': ['.txt']}
                }]
            });
            
            const writable = await handle.createWritable();
            await writable.write(content);
            await writable.close();
            alert('Arquivo salvo com sucesso!');
        } catch (err) {
            if (err.name !== 'AbortError') {
                console.error(err);
                fallbackExport(content); // Chama o método antigo se falhar
            }
        }
    } else {
        fallbackExport(content);
    }
}

// Método alternativo para navegadores antigos
function fallbackExport(content) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `organistas-ccb-${new Date().toISOString().slice(0, 10)}.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 100);
}
