    <style>

        .editable-cell input {

           background-color: #e6f7ff !important;

        .order-select {

/* Remove os checkboxes padrão e cria visualização personalizada */
.dsst-editor input[type="checkbox"] {

}

.dsst-editor label {

    border-radius: 4px;
    cursor: pointer;

<body>

    <!-instrucoes aqui->

    <div class="main-container">
        <div class="left-panel">
            <h2>Lista de Organistas</h2>
            
<div style="margin-bottom: 20px;">
    <label for="organistsData" style="display: none;">Dados das Organistas (CSV):</label><br>
<textarea id="organistsData" rows="1" style="display: none; width: 100%; font-family: monospace; margin-bottom: 10px; height: 30px;">

    <div class="action-buttons">
        <button onclick="importOrganists()">Importar Dados</button>
        <button onclick="document.getElementById('fileInput').click()" class="import-txt-btn">Importar de TXT</button>

</div>            
            <table id="organistsTable">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Ordem MH</th>
                        <th>Ordem CO</th>
                        <th>Parceira MH</th>
                        <th>Ordem RJM</th>
                        <th>Dia sem tocar</th>
                        <th>Início sem tocar</th>
                        <th>Fim sem tocar</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            
            <button onclick="addNewOrganist()" class="add-organist-btn">Adicionar Nova Organista</button>
        </div>

        <div class="right-panel">
            <h2>Gerar Rodízio</h2>
            <div>
                <label for="startDate">Data Inicial:</label>
                <input type="date" id="startDate">
                
                <label for="months">Meses:</label>
                <input type="number" id="months" value="6" min="1" max="12">
                
                <div class="service-days">
                    <label>Dias de Culto:</label>
                    <div class="day-checkboxes">
                        <label><input type="checkbox" class="day-checkbox" value="0" checked> Domingo</label>
                        <label><input type="checkbox" class="day-checkbox" value="1"> Segunda</label>
                        <label><input type="checkbox" class="day-checkbox" value="2"> Terça</label>
                        <label><input type="checkbox" class="day-checkbox" value="3" checked> Quarta</label>
                        <label><input type="checkbox" class="day-checkbox" value="4"> Quinta</label>
                        <label><input type="checkbox" class="day-checkbox" value="5"> Sexta</label>
                        <label><input type="checkbox" class="day-checkbox" value="6" checked> Sábado</label>
                    </div>
                </div>
                
                <button onclick="generateSchedule()">Gerar Rodízio</button>
                <button onclick="openScheduleModal()" class="download-btn">Visualizar Rodízio</button>
                <button onclick="saveScheduleToPDF()" class="export-btn">Salvar Rodízio</button>            </div>

                <p>Gere o rodízio para visualizar os meses aqui.</p>

    <div id="scheduleModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="text-align: center;">Rodízio de Organistas</h2>
            <div id="modalScheduleView"></div>
            <div class="modal-actions">
                <button onclick="window.print()">Imprimir</button>
                <button onclick="closeModal()">Fechar</button>
            </div>
        </div>
    </div>

<script>
    // Variável global para armazenar as organistas
    let organists = [];
    let currentSchedule = {};
    let nextServiceDate = null;
    let priorityOrganists = {
        mh: null,
        co: null,
        rjm: null
    };

    // Inicializa a página
    document.addEventListener('DOMContentLoaded', function() {
        renderOrganistsTable();
        setDefaultStartDate();
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);
    });

    // Funções auxiliares
    function getMonthName(monthIndex) {
        const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        return months[monthIndex];
    }

    function getDayName(dayIndex) {
        const days = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
        return days[dayIndex];
    }

    function isValidDate(dateString) {
        return /^\d{2}\/\d{2}\/\d{4}$/.test(dateString);
    }

    function setDefaultStartDate() {
        const today = new Date();
        const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        const formattedDate = nextMonth.toISOString().split('T')[0];
        document.getElementById('startDate').value = formattedDate;
    }

    // Funções para DSST simplificado
    function formatDsstValue(dsst) {
        if (!dsst) return '';
        const days = Array.isArray(dsst) ? dsst : [dsst];
        return days.map(d => {
            if (d === 0) return 'Dom';
            if (d === 3) return 'Qua';
            if (d === 6) return 'Sáb';
            return '';
        }).filter(Boolean).join(' | ');
    }

    function isDsstSelected(dsst, day) {
        if (!dsst) return '';
        return (Array.isArray(dsst) ? dsst.includes(day) : dsst === day) ? 'checked' : '';
    }

    // Funções de manipulação de dados
    function importOrganists() {
        try {
            const csvData = document.getElementById('organistsData').value.trim();
            if (!csvData) {
                alert('Nenhum dado para importar!');
                return;
            }

            const lines = csvData.split('\n');
            organists = [];
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                const cells = line.split(',').map(cell => {
                    cell = cell.trim();
                    if (cell.startsWith('"') && cell.endsWith('"')) {
                        return cell.slice(1, -1);
                    }
                    return cell === '' ? null : cell;
                });
                
                organists.push({
                    name: cells[0],
                    mhOrder: cells[1] ? parseInt(cells[1]) : null,
                    coOrder: cells[2] ? parseInt(cells[2]) : null,
                    parceira: cells[3] || null,
                    rjmOrder: cells[4] ? parseInt(cells[4]) : null,
                    dsst: cells[5] ? (cells[5].includes('|') ? 
                        cells[5].split('|').map(Number) : 
                        parseInt(cells[5])) : null,
                    idtst: cells[6] || null,
                    fdtst: cells[7] || null
                });
            });
            
            renderOrganistsTable();
            alert(`Dados importados com sucesso! ${organists.length} organistas cadastradas.`);
        } catch (error) {
            alert('Erro ao importar dados: ' + error.message);
            console.error(error);
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        
        reader.onload = function(e) {
            document.getElementById('organistsData').value = e.target.result;
            importOrganists();
        };
        
        reader.onerror = function() {
            alert('Erro ao ler o arquivo');
        };
        
        reader.readAsText(file);
        event.target.value = '';
    }

    function exportToTxt() {
        const content = organists.map(org => {
            return [
                org.name,
                org.mhOrder !== null ? org.mhOrder : '',
                org.coOrder !== null ? org.coOrder : '',
                org.parceira ? `"${org.parceira}"` : '',
                org.rjmOrder !== null ? org.rjmOrder : '',
                org.dsst !== null ? (Array.isArray(org.dsst) ? org.dsst.join('|') : org.dsst) : '',
                org.idtst || '',
                org.fdtst || ''
            ].join(',');
        }).join('\n');

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `organistas-ccb-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    // Funções de renderização
    function renderOrganistsTable() {
        const tbody = document.querySelector('#organistsTable tbody');
        tbody.innerHTML = '';
        
        organists.sort((a, b) => {
            const aCO = a.coOrder === null ? 999 : a.coOrder;
            const bCO = b.coOrder === null ? 999 : b.coOrder;
            return aCO - bCO || (a.mhOrder || 999) - (b.mhOrder || 999);
        });
        
        organists.forEach((org, index) => {
            const row = document.createElement('tr');
            const isPriorityMH = org.name === priorityOrganists.mh;
            const isPriorityCO = org.name === priorityOrganists.co;
            const isPriorityRJM = org.name === priorityOrganists.rjm;

            row.innerHTML = `
                <td class="editable-cell" data-field="name">
                    <span class="cell-value">${org.name}</span>
                    <input type="text" value="${org.name}">
                </td>
                <td class="editable-cell" data-field="mhOrder">
                    <span class="cell-value ${isPriorityMH ? 'priority-cell' : ''}">${org.mhOrder === null ? '' : org.mhOrder}</span>
                </td>
                <td class="editable-cell" data-field="coOrder">
                    <span class="cell-value ${isPriorityCO ? 'priority-cell' : ''}">${org.coOrder === null ? '' : org.coOrder}</span>
                </td>
                <td class="editable-cell" data-field="parceira">
                    <span class="cell-value">${org.parceira || ''}</span>
                    <input type="text" value="${org.parceira || ''}">
                </td>
                <td class="editable-cell" data-field="rjmOrder">
                    <span class="cell-value ${isPriorityRJM ? 'priority-cell' : ''}">${org.rjmOrder === null ? '' : org.rjmOrder}</span>
                </td>
                <td class="editable-cell" data-field="dsst">
                    <span class="cell-value">${formatDsstValue(org.dsst)}</span>
                    <div class="dsst-editor" style="display: none;">
                        <input type="checkbox" value="0" id="dsst-${index}-0" ${isDsstSelected(org.dsst, 0)}>
                        <label for="dsst-${index}-0">Dom</label>
                        
                        <input type="checkbox" value="3" id="dsst-${index}-3" ${isDsstSelected(org.dsst, 3)}>
                        <label for="dsst-${index}-3">Qua</label>
                        
                        <input type="checkbox" value="6" id="dsst-${index}-6" ${isDsstSelected(org.dsst, 6)}>
                        <label for="dsst-${index}-6">Sáb</label>
                    </div>
                </td>
                <td class="editable-cell" data-field="idtst">
                    <span class="cell-value">${org.idtst || ''}</span>
                    <input type="text" value="${org.idtst || ''}" placeholder="dd/mm/aaaa">
                </td>
                <td class="editable-cell" data-field="fdtst">
                    <span class="cell-value">${org.fdtst || ''}</span>
                    <input type="text" value="${org.fdtst || ''}" placeholder="dd/mm/aaaa">
                </td>
            `;
            
            tbody.appendChild(row);
        });
        
        setupEditableCells();
    }

    function setupEditableCells() {
        // Células de texto simples
        document.querySelectorAll('.editable-cell:not([data-field$="Order"]):not([data-field="dsst"])').forEach(cell => {
            cell.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (this.classList.contains('editing')) return;
                
                this.classList.add('editing');
                const input = this.querySelector('input');
                input.focus();
            });
            
            const input = cell.querySelector('input');
            input.addEventListener('blur', () => saveCellEdit(cell));
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') saveCellEdit(cell);
            });
        });

        // Células de dias sem tocar (DSST)
        document.querySelectorAll('.editable-cell[data-field="dsst"]').forEach(cell => {
            cell.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') return;
                if (this.classList.contains('editing')) return;
                
                this.classList.add('editing');
                const editor = this.querySelector('.dsst-editor');
                editor.style.display = 'block';
                
                // Fecha ao clicar fora
                const clickOutside = (e) => {
                    if (!cell.contains(e.target)) {
                        saveCellEdit(cell);
                        document.removeEventListener('click', clickOutside);
                    }
                };
                setTimeout(() => document.addEventListener('click', clickOutside), 10);
            });
        });

        // Células de ordem (dropdown numérico)
        document.querySelectorAll('.editable-cell[data-field$="Order"]').forEach(cell => {
            const select = document.createElement('div');
            select.className = 'order-select';
            
            for (let i = 1; i <= 20; i++) {
                const option = document.createElement('div');
                option.className = 'order-option';
                option.textContent = i;
                option.dataset.value = i;
                select.appendChild(option);
            }

    function saveCellEdit(cell) {
        const row = cell.parentNode;
        const rowIndex = Array.from(row.parentNode.children).indexOf(row);
        const field = cell.getAttribute('data-field');
        
        if (field === 'dsst') {
            const checkboxes = cell.querySelectorAll('.dsst-editor input:checked');
            const values = Array.from(checkboxes).map(cb => parseInt(cb.value));
            organists[rowIndex][field] = values.length > 0 ? (values.length === 1 ? values[0] : values) : null;
            cell.querySelector('.cell-value').textContent = formatDsstValue(organists[rowIndex][field]);
        } else {

            if (!input) return;
            
            let value = input.value.trim();
            
            if (field === 'mhOrder' || field === 'coOrder' || field === 'rjmOrder') {
                value = value === '' ? null : parseInt(value);
            } else if ((field === 'idtst' || field === 'fdtst') && value !== '' && !isValidDate(value)) {
                alert('Formato de data inválido. Use dd/mm/aaaa');
                return;
            }
            
            organists[rowIndex][field] = value;
            cell.querySelector('.cell-value').textContent = value || '';
        }
        
        cell.classList.remove('editing');
        const editor = cell.querySelector('.dsst-editor');
        if (editor) editor.style.display = 'none';
    }

    // Função principal refatorada
    function generateSchedule() {
        if (!validateInputs()) return;
        
        const { startDate, endDate, selectedDays } = getScheduleParameters();
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        // Criar estrutura vazia
        const scheduleByMonth = createEmptyCalendar(startDate, endDate, selectedDays, today);
        
        // Preencher com organistas - agora em 3 etapas separadas
        //aqui
        fillCultoOficialSchedule(scheduleByMonth);
        fillParceirasMH(scheduleByMonth); // Depois preenche as parceiras MH
        fillMeiaHoraSchedule(scheduleByMonth);
        fillRJMSchedule(scheduleByMonth);
        
        // Atualizar views
        currentSchedule = scheduleByMonth;
        updateScheduleView(scheduleByMonth);
        updateModalScheduleView(scheduleByMonth);
    }

    function fillRJMSchedule(scheduleByMonth) {
        // 1. Filtra APENAS organistas que tocam na RJM
        const rjmOrganists = organists.filter(org => 
            org?.rjmOrder !== null && 
            org.name !== 'Danielly' // Exclui especificamente a Danielly
        ).sort((a, b) => a.rjmOrder - b.rjmOrder);

        let currentIndex = 0;

        Object.values(scheduleByMonth).forEach(monthSchedule => {
            monthSchedule.forEach(item => {
                if (item.date.getDay() === 0) { // Apenas domingos
                    // 2. Encontra todas disponíveis nesta data
                    const availableToday = rjmOrganists.filter(org => 
                        isOrganistAvailableForRJM(org, item.date)
                    );

                    if (availableToday.length === 0) {
                        item.rjm = 'N/D';
                        item.isAdjusted = true;
                        return;
                    }

                    // 3. Encontra a próxima na ordem considerando apenas disponíveis
                    let selectedOrganist = null;
                    let adjusted = false;
                    
                    // Procura na ordem normal
                    for (let i = 0; i < rjmOrganists.length; i++) {
                        const candidate = rjmOrganists[(currentIndex + i) % rjmOrganists.length];
                        if (availableToday.includes(candidate)) {
                            selectedOrganist = candidate;
                            adjusted = i > 0;
                            currentIndex = (currentIndex + i + 1) % rjmOrganists.length;
                            break;
                        }
                    }

                    item.rjm = selectedOrganist ? 
                        `${selectedOrganist.name}${adjusted ? ' **' : ''}` : 
                        'N/D';
                    item.isAdjusted = adjusted;
                }
            });
        });
    }

    isOrganistAvailableForRJM
    // Função específica para RJM
    function isOrganistAvailableForRJM(org, date) {
        // 1. Verifica período sem tocar
        if (org.idtst && isDateInRange(date, org.idtst, org.fdtst)) {
            return false;
        }

        // 2. Verifica dias sem tocar (RJM sempre domingo - day 0)
        if (org.dsst) {
            const forbiddenDays = Array.isArray(org.dsst) ? org.dsst : [org.dsst];
            if (forbiddenDays.includes(0)) return false; // 0 = Domingo
        }

        return true;
    }

    function isDateInRange(date, startDateStr, endDateStr) {
        if (!startDateStr) return false;
        
        const [startDay, startMonth, startYear] = startDateStr.split('/').map(Number);
        const start = new Date(startYear, startMonth - 1, startDay);
        
        if (!endDateStr) {
            return date.getTime() === start.getTime();
        }
        
        const [endDay, endMonth, endYear] = endDateStr.split('/').map(Number);
        const end = new Date(endYear, endMonth - 1, endDay);
        
        return date >= start && date <= end;
    }

    function isOrganistAvailable(org, dayOfWeek, currentDate, type) {
        if (!org) return false;
        
        // Verifica período sem tocar
        if (org.idtst && isDateInRange(currentDate, org.idtst, org.fdtst)) {
            return false;
        }
        
        // Verifica dias sem tocar (DSST)
        if (org.dsst) {
            let forbiddenDays = [];
            if (Array.isArray(org.dsst)) {
                forbiddenDays = org.dsst;
            } else if (typeof org.dsst === 'number') {
                forbiddenDays = [org.dsst];
            }
            
            if (forbiddenDays.includes(dayOfWeek)) {
                return false;
            }
        }
        
        // Verifica se a organista tem ordem definida para este tipo de culto
        if (type === 'mh' && org.mhOrder === null) return false;
        if (type === 'co' && org.coOrder === null) return false;
        if (type === 'rjm' && org.rjmOrder === null) return false;
        
        return true;
    }

    // Funções auxiliares
    function validateInputs() {
        if (!organists || organists.length === 0) {
            alert('Por favor, importe a lista de organistas primeiro');
            return false;
        }

        const startDateInput = document.getElementById('startDate').value;
        if (!startDateInput) {
            alert('Por favor, selecione uma data válida');
            return false;
        }
        
        const selectedDays = [];
        document.querySelectorAll('.day-checkbox:checked').forEach(checkbox => {
            const dayValue = parseInt(checkbox.value);
            if (!isNaN(dayValue)) {
                selectedDays.push(dayValue);
            }
        });
        
        if (selectedDays.length === 0) {
            alert('Selecione pelo menos um dia de culto');
            return false;
        }
        
        return true;
    }

    function getScheduleParameters() {
        const [year, month, day] = document.getElementById('startDate').value.split('-').map(Number);
        const startDate = new Date(year, month - 1, day);
        const months = parseInt(document.getElementById('months').value) || 6;
        const endDate = new Date(startDate.getFullYear(), startDate.getMonth() + months, 0);
        
        const selectedDays = [];
        document.querySelectorAll('.day-checkbox:checked').forEach(checkbox => {
            selectedDays.push(parseInt(checkbox.value));
        });
        
        return { startDate, endDate, selectedDays };
    }

    function createEmptyCalendar(startDate, endDate, selectedDays, today) {
        const scheduleByMonth = {};
        let currentDate = new Date(startDate);
        nextServiceDate = null;

        while (currentDate <= endDate) {
            const dayOfWeek = currentDate.getDay();
            
            if (selectedDays.includes(dayOfWeek)) {
                const monthYear = `${getMonthName(currentDate.getMonth())} ${currentDate.getFullYear()}`;
                if (!scheduleByMonth[monthYear]) {
                    scheduleByMonth[monthYear] = [];
                }

                const isNextService = !nextServiceDate && currentDate >= today;
                if (isNextService) {
                    nextServiceDate = currentDate;
                }

                scheduleByMonth[monthYear].push({
                    date: new Date(currentDate),
                    day: currentDate.getDate(),
                    dayName: getDayName(dayOfWeek),
                    mh: '', // Será preenchido depois
                    co: '', // Será preenchido depois
                    rjm: (dayOfWeek === 0) ? '' : null, // Apenas domingos
                    isNextService,
                    isAdjusted: false
                });
            }
            
            currentDate.setDate(currentDate.getDate() + 1);
        }
        
        return scheduleByMonth;
    }

    function assignOrganist(organistList, scheduleItem, type, currentIndex, lastOrganistName = null, pendingOrganists = []) {
        const dayOfWeek = scheduleItem.date.getDay();
        const currentDate = scheduleItem.date;
        
        // Tenta usar organistas pendentes primeiro (apenas para MH)
        if (type === 'mh' && pendingOrganists.length > 0) {
            for (let i = 0; i < pendingOrganists.length; i++) {
                const candidate = pendingOrganists[i];
                if (isOrganistAvailable(candidate, dayOfWeek, currentDate, type) && 
                    candidate.name !== lastOrganistName) {
                    pendingOrganists.splice(i, 1);
                    return {
                        organist: candidate,
                        adjusted: true,
                        newIndex: currentIndex,
                        pendingOrganists
                    };
                }
            }
        }

        // Busca na ordem normal
        let attempts = 0;
        let adjusted = false;
        let index = currentIndex;
        let selectedOrganist = null;

        do {
            const candidate = organistList[index % organistList.length];
            
            if (isOrganistAvailable(candidate, dayOfWeek, currentDate, type) && 
                (type !== 'mh' || candidate.name !== lastOrganistName)) {
                selectedOrganist = candidate;
                break;
            }
            
            // Adiciona às pendentes se não estiver já na lista (apenas para MH)
            if (type === 'mh' && !pendingOrganists.some(o => o.name === candidate.name)) {
                pendingOrganists.push(candidate);
            }
            
            index = (index + 1) % organistList.length;
            attempts++;
            adjusted = attempts > 0;
        } while (attempts < organistList.length);

        // Se não encontrou, procura qualquer disponível
        if (!selectedOrganist) {
            for (const org of organistList) {
                if (isOrganistAvailable(org, dayOfWeek, currentDate, type) && 
                    (type !== 'mh' || org.name !== lastOrganistName)) {
                    selectedOrganist = org;
                    adjusted = true;
                    break;
                }
            }
        }

        return {
            organist: selectedOrganist,
            adjusted,
            newIndex: (selectedOrganist && !adjusted) ? (index + 1) % organistList.length : currentIndex,
            pendingOrganists
        };
    }

    function formatDate(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}/${month}/${year}`;
    }

    // 1. Função específica para Meia Hora
    function fillMeiaHoraSchedule(scheduleByMonth) {
        // 1. Filtra organistas válidas para MH (exceto as que são parceiras de CO)
        const mhOrganists = organists
            .filter(org => org.mhOrder !== null && !isParceiraDeCO(org))
            .sort((a, b) => a.mhOrder - b.mhOrder);

        let mhIndex = 0;
        let pendingSwaps = []; // Armazena trocas pendentes de DSST

        Object.values(scheduleByMonth).forEach(monthSchedule => {
            monthSchedule.forEach(item => {
                // 2. Não mexe em MH já preenchido (respeita parceiras do CO)
                if (item.mh && item.mh.trim() !== '' && item.mh !== 'N/D') {
                    return;
                }

                // 3. Processa a organista da MH
                const result = processOrganistMH(item, mhOrganists, mhIndex, pendingSwaps);
                
                item.mh = result.organist ? `${result.organist.name}${result.adjusted ? ' **' : ''}` : 'N/D';
                item.isAdjusted = item.isAdjusted || result.adjusted;
                mhIndex = result.newIndex;
            });
        });
    }

    // 2. Função específica para Culto Oficial
    function fillCultoOficialSchedule(scheduleByMonth) {
        // 1. Filtra e ordena as organistas válidas para CO
        const coOrganists = organists
            .filter(org => org.coOrder !== null)
            .sort((a, b) => a.coOrder - b.coOrder);

        let coIndex = 0;
        let pendingSwaps = []; // Armazena trocas pendentes de DSST

        // 2. Processa todos os dias (incluindo domingos)
        Object.values(scheduleByMonth).forEach(monthSchedule => {
            monthSchedule.forEach(item => {
                // 3. Tenta resolver trocas pendentes primeiro
                const resolvedSwap = resolvePendingSwap(item, pendingSwaps);
                if (resolvedSwap.success) {
                    item.co = resolvedSwap.organist.name;
                    item.isAdjusted = true;
                    return;
                }

                // 4. Processa a organista atual do CO
                const result = processOrganistCO(item, coOrganists, coIndex, pendingSwaps);
                
                // 5. Atualiza os dados do culto oficial
                item.co = result.organist ? `${result.organist.name}${result.adjusted ? ' **' : ''}` : 'N/D';
                item.isAdjusted = result.adjusted;
                coIndex = result.newIndex;
            });
        });
    }

    function isInNoPlayPeriod(org, date) {
        if (!org.idtst) return false;
        
        // Converte strings de data para objetos Date
        const [startDay, startMonth, startYear] = org.idtst.split('/').map(Number);
        const startDate = new Date(startYear, startMonth - 1, startDay);
        
        if (!org.fdtst) {
            return date.getTime() === startDate.getTime();
        }
        
        const [endDay, endMonth, endYear] = org.fdtst.split('/').map(Number);
        const endDate = new Date(endYear, endMonth - 1, endDay);
        
        return date >= startDate && date <= endDate;
    }

    function hasDSST(org, date) {
        if (!org.dsst) return false;
        const dayOfWeek = date.getDay();
        const forbiddenDays = Array.isArray(org.dsst) ? org.dsst : [org.dsst];
        return forbiddenDays.includes(dayOfWeek);
    }

    function isOrganistAvailableForCO(org, date, ignoreDSST = false) {
        // 1. Verifica período sem tocar
        if (isInNoPlayPeriod(org, date)) return false;
        
        // 2. Verifica DSST (a menos que seja ignorado para trocas)
        if (!ignoreDSST && hasDSST(org, date)) return false;
        
        return true;
    }

    function processPendingDSST(item, pendingDSST) {
        for (let i = 0; i < pendingDSST.length; i++) {
            const swap = pendingDSST[i];
            if (isOrganistAvailableForCO(swap.organist, item.date, true)) { // Ignora DSST para trocas
                pendingDSST.splice(i, 1); // Remove da lista de pendentes
                return {
                    success: true,
                    organist: swap.organist
                };
            }
        }
        return { success: false };
    }

    // Encontra a próxima organista disponível (para troca de DSST)
    function findNextAvailable(item, coOrganists, startIndex) {
        for (let i = 1; i <= coOrganists.length; i++) {
            const candidate = coOrganists[(startIndex + i) % coOrganists.length];
            if (!isInNoPlayPeriod(candidate, item.date) && !hasDSST(candidate, item.date)) {
                return {
                    organist: candidate,
                    newIndex: (startIndex + i + 1) % coOrganists.length
                };
            }
        }
        return null;
    }

    // Função auxiliar 3: Atribui parceira MH
    function assignParceiraMH(item, coOrganist) {
        const parceira = organists.find(org => org.name === coOrganist.parceira);
        if (parceira && isOrganistAvailable(parceira, item.date.getDay(), item.date, 'mh')) {
            item.mh = parceira.name;
        } else {
            item.mh = 'N/D';
            item.isAdjusted = true;
        }
    }

    // Função auxiliar 1: Resolve trocas pendentes de DSST
    function resolvePendingSwap(item, pendingSwaps) {
        for (let i = 0; i < pendingSwaps.length; i++) {
            const swap = pendingSwaps[i];
            if (isOrganistAvailable(swap.organist, item.date.getDay(), item.date, 'co')) {
                pendingSwaps.splice(i, 1);
                return { success: true, organist: swap.organist };
            }
        }
        return { success: false };
    }

    // Função auxiliar 2: Lógica principal do CO
    function processOrganistCO(item, coOrganists, currentIndex, pendingSwaps) {
        const maxAttempts = coOrganists.length * 2;
        let attempts = 0;
        let adjusted = false;

        while (attempts < maxAttempts) {
            const candidate = coOrganists[currentIndex % coOrganists.length];
            currentIndex = (currentIndex + 1) % coOrganists.length;
            attempts++;

            // Situação 1: Período sem tocar (pula e mantém ordem)
            if (isInNoPlayPeriod(candidate, item.date)) {
                continue;
            }

            // Situação 2: DSST (marca para troca)
            if (hasDSST(candidate, item.date)) {
                pendingSwaps.push({
                    organist: candidate,
                    originalDate: item.date
                });
                adjusted = true;
                continue;
            }

            // Situação 3: Organista disponível
            return {
                organist: candidate,
                adjusted,
                newIndex: currentIndex
            };
        }

        // Fallback: nenhuma organista disponível
        return { organist: null, adjusted: true, newIndex: currentIndex };
    }

    function fillParceirasMH(scheduleByMonth) {
        Object.values(scheduleByMonth).forEach(monthSchedule => {
            monthSchedule.forEach(item => {
                // Só preenche se MH estiver vazio/não definido
                if (!item.mh || item.mh.trim() === '') {
                    // Extrai o nome limpo da organista CO (remove ** e espaços)
                    const coName = item.co?.replace(/\*\*/g, '').trim() || '';
                    
                    if (coName && coName !== 'N/D') {
                        // Encontra a organista CO com correspondência flexível
                        const coOrganist = organists.find(org => 
                            org.name.trim().toLowerCase() === coName.toLowerCase()
                        );
                        
                        // Se encontrou e tem parceira definida
                        if (coOrganist?.parceira) {
                            const parceiraName = coOrganist.parceira.trim();
                            const parceira = organists.find(org => 
                                org.name.trim().toLowerCase() === parceiraName.toLowerCase()
                            );
                            
                            // Verificação simplificada de disponibilidade
                            if (parceira) {
                                item.mh = parceira.name;
                            } else {
                                item.mh = 'N/D';
                                item.isAdjusted = true;
                            }
                        }
                    }
                }
            });
        });
    }

    // Função auxiliar 1: Verifica se é parceira de CO
    function isParceiraDeCO(organist) {
        return organists.some(org => org.parceira === organist.name);
    }

    // Função auxiliar 2: Lógica principal da MH
    function processOrganistMH(item, mhOrganists, currentIndex, pendingSwaps) {
        // A. Tenta resolver trocas pendentes primeiro
        const resolvedSwap = resolvePendingSwapMH(item, pendingSwaps);
        if (resolvedSwap.success) {
            return {
                organist: resolvedSwap.organist,
                adjusted: true,
                newIndex: currentIndex // Mantém o índice atual
            };
        }

        // B. Procura próxima organista disponível
        const maxAttempts = mhOrganists.length * 2;
        let attempts = 0;
        let adjusted = false;

        while (attempts < maxAttempts) {
            const candidate = mhOrganists[currentIndex % mhOrganists.length];
            currentIndex = (currentIndex + 1) % mhOrganists.length;
            attempts++;

            // Situação 1: Período sem tocar (pula e mantém ordem)
            if (isInNoPlayPeriod(candidate, item.date)) {
                continue;
            }

            // Situação 2: DSST (marca para troca)
            if (hasDSST(candidate, item.date)) {
                pendingSwaps.push({
                    organist: candidate,
                    originalDate: item.date
                });
                adjusted = true;
                continue;
            }

            // Situação 3: Organista disponível
            return {
                organist: candidate,
                adjusted,
                newIndex: currentIndex
            };
        }

        // Fallback: nenhuma organista disponível
        return { organist: null, adjusted: true, newIndex: currentIndex };
    }

    // Função auxiliar 3: Resolve trocas pendentes de DSST para MH
    function resolvePendingSwapMH(item, pendingSwaps) {
        for (let i = 0; i < pendingSwaps.length; i++) {
            const swap = pendingSwaps[i];
            if (isOrganistAvailable(swap.organist, item.date.getDay(), item.date, 'mh')) {
                pendingSwaps.splice(i, 1);
                return { success: true, organist: swap.organist };
            }
        }
        return { success: false };
    }

    function saveScheduleToPDF() {
        // Verifica se há dados para exportar
        if (Object.keys(currentSchedule).length === 0) {
            alert('Por favor, gere o rodízio primeiro');
            return;
        }

        // Cria novo documento PDF
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
            orientation: 'landscape',
            unit: 'mm'
        });

        // Configurações do documento
        let yPosition = 15;
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 10;

        // Adiciona título
        doc.setFontSize(16);
        doc.setTextColor(40);
        doc.text('RODÍZIO DE ORGANISTAS CCB', pageWidth / 2, yPosition, { align: 'center' });
        yPosition += 10;

        // Configurações da tabela
        const headers = [['Dia', 'Dia Semana', 'Meia Hora', 'Culto Oficial', 'RJM']];
        const tableConfig = {
            startY: yPosition,
            head: headers,
            theme: 'grid',
            headStyles: {
                fillColor: [41, 128, 185],
                textColor: 255,
                fontStyle: 'bold'
            },
            columnStyles: {
                0: { cellWidth: 15 },
                1: { cellWidth: 25 },
                2: { cellWidth: 35 },
                3: { cellWidth: 35 },
                4: { cellWidth: 35 }
            },
            didDrawPage: function(data) {
                // Adiciona número de página
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(
                    `Página ${data.pageCount}`,
                    pageWidth - margin,
                    doc.internal.pageSize.getHeight() - 10,
                    { align: 'right' }
                );
            }
        };

        // Adiciona cada mês ao PDF
        Object.entries(currentSchedule).forEach(([monthYear, schedule]) => {
            // Adiciona cabeçalho do mês
            doc.setFontSize(14);
            doc.setTextColor(0, 0, 0);
            doc.text(monthYear.toUpperCase(), margin, yPosition);
            yPosition += 10;

            // Prepara dados da tabela
            const tableData = schedule.map(item => [
                item.day.toString().padStart(2, '0'),
                item.dayName,
                item.mh || '',
                item.co || '',
                item.rjm || ''
            ]);

            // Adiciona tabela ao documento
            doc.autoTable({
                ...tableConfig,
                body: tableData,
                startY: yPosition
            });

            // Atualiza posição Y e adiciona nova página se necessário
            yPosition = doc.lastAutoTable.finalY + 10;
            if (yPosition > doc.internal.pageSize.getHeight() - 20) {
                doc.addPage();
                yPosition = 15;
            }
        });

        // Salva o PDF
        doc.save(`Rodizio_Organistas_CCB_${new Date().toLocaleDateString('pt-BR')}.pdf`);
    }


</script>
