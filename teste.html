<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🎵 Treino Musical</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            min-height: 100vh;
            transform: rotate(0deg);
        }
        
        /* Forçar orientação paisagem */
        @media screen and (orientation: portrait) {
            body::before {
                content: "📱 Gire seu celular para horizontal";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5em;
                text-align: center;
                padding: 20px;
                z-index: 1000;
                font-weight: bold;
            }
            
            .container {
                display: none;
            }
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        h1 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .game-area {
            width: 100%;
        }
        
        .pentagrama-container {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #notation {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .timer-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background: #f0f2ff;
            border-radius: 8px;
        }
        
        .timer-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .timer {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }
        
        .timer-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 2px;
        }
        
        .current-note {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            text-align: center;
            min-height: 25px;
        }
        
        .feedback {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .feedback.correct {
            color: #06D6A0;
            animation: pulse 0.5s;
        }
        
        .feedback.error {
            color: #EF476F;
            animation: shake 0.5s;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .note-btn {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        
        .note-btn:active {
            transform: scale(0.95);
        }
        
        .note-do { background: linear-gradient(45deg, #FF6B6B, #FF8E8E); }
        .note-re { background: linear-gradient(45deg, #4ECDC4, #44A08D); }
        .note-mi { background: linear-gradient(45deg, #FFD166, #FFB347); }
        .note-fa { background: linear-gradient(45deg, #06D6A0, #06A678); }
        .note-sol { background: linear-gradient(45deg, #118AB2, #0A6C8F); }
        .note-la { background: linear-gradient(45deg, #EF476F, #D43A5E); }
        .note-si { background: linear-gradient(45deg, #9D4EDD, #7B2CBF); }
        
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .control-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        
        .end-btn {
            background: linear-gradient(45deg, #EF476F, #D43A5E);
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .stat-box {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 0.75em;
            color: #666;
            margin-top: 3px;
        }
        
        .error-warning {
            background: #FFF5F5;
            border-left: 4px solid #EF476F;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .error-count {
            color: #EF476F;
            font-weight: bold;
        }
        
        /* Modal de Game Over */
        .game-over-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .game-over-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: popIn 0.3s;
        }
        
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .game-over-title {
            font-size: 2em;
            color: #EF476F;
            margin-bottom: 15px;
        }
        
        .game-over-message {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
        }
        
        .game-over-stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .modal-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #06D6A0, #06A678);
            color: white;
        }
        
        .close-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        
        .instructions {
            font-size: 0.8em;
            color: #666;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background: #f0f2ff;
            border-radius: 5px;
        }
        
        /* Ajustes para telas muito pequenas */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .note-btn {
                height: 50px;
                font-size: 1.1em;
            }
            
            .timer {
                font-size: 0.8em;
            }
            
            .stat-value {
                font-size: 1.5em;
            }
        }
        
        @media (max-height: 600px) {
            .container {
                padding: 10px;
            }
            
            .pentagrama-container {
                min-height: 120px;
                padding: 10px;
            }
            
            .note-btn {
                height: 45px;
            }
        }

        .mostra-erro {
            opacity: 0.5; 
            filter: grayscale(100%)
        }

/* ADICIONE ESTES ESTILOS */
.progress-container {
    width: 100%;
    height: 10px;
    background: #f0f0f0;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 8px;
    border: 1px solid #ddd;
}

.progress-bar {
    height: 100%;
    width: 100%;
    background: #4CAF50;
    border-radius: 5px;
    transition: width 1s linear;
    box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
}

.progress-bar.warning {
    background: #FF9800;
    box-shadow: 0 0 5px rgba(255, 152, 0, 0.3);
}

.progress-bar.danger {
    background: #F44336;
    box-shadow: 0 0 5px rgba(244, 67, 54, 0.3);
    animation: pulse 0.5s infinite alternate;
}

@keyframes pulse {
    from { opacity: 1; }
    to { opacity: 0.7; }
}

.timer-label {
    font-size: 0.8em;
    color: #666;
    text-align: center;
    font-weight: 500;
}        

</style>
</head>

<body><br><br><br>
    <div class="container">
        <div style="width: 100%; display: flex; " id="Placar">
            <div style="width: 10%; padding: 10px; text-align: center; border-right: 2px solid white;">Acertos</div>
            <div style="width: 10%; padding: 10px; text-align: center; border-right: 2px solid white; font-weight: bold; font-size: 1.2em;" id="Acertos">0</div>
            <div style="width: 55%; padding: 10px; text-align: center; font-weight: bold;"></div>
            <div style="width: 5%; padding: 10px; text-align: center; border-right: 2px solid white;">Erros</div>
            <div style="width: 20%; padding: 10px; text-align: left; font-size: 0.8em;" id="Erros">
                <span id="erro1" class="mostra-erro">❌</span>
                <span id="erro2" class="mostra-erro">❌</span>
                <span id="erro3" class="mostra-erro">❌</span>
                <span id="erro4" class="mostra-erro">❌</span>
                <span id="erro5" class="mostra-erro">❌</span>
            </div>
        </div>
        <div class="error-warning" id="errorWarning">
            ⚠️ Cuidado! Você tem <span class="error-count" id="errorCount">0</span> erros. Ao atingir 5 erros, o jogo termina!
        </div>
        <div class="game-area">
            <div class="pentagrama-container">
                <div id="notation"></div>
            </div>
            
            <!-- NO LUGAR DA SEÇÃO DO TIMER ATUAL -->
            <div class="timer-section">
                <!-- Barra de progresso (1/3 da largura) -->
                <div class="timer-box" style="width: 33.33%; min-width: 100px;">
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <div class="timer-label">⏱️ TEMPO</div>
                </div>
                
                <!-- Espaço vazio (2/3 da largura) -->
                <div style="width: 66.66%;"></div>
            </div>            
            <div class="feedback" id="feedback"></div>
            
            <div class="notes-grid">
                <button class="note-btn note-do" onclick="checkAnswer('C')">Dó</button>
                <button class="note-btn note-re" onclick="checkAnswer('D')">Ré</button>
                <button class="note-btn note-mi" onclick="checkAnswer('E')">Mi</button>
                <button class="note-btn note-fa" onclick="checkAnswer('F')">Fá</button>
                <button class="note-btn note-sol" onclick="checkAnswer('G')">Sol</button>
                <button class="note-btn note-la" onclick="checkAnswer('A')">Lá</button>
                <button class="note-btn note-si" onclick="checkAnswer('B')">Si</button>
            </div>
            
            <div class="controls-row">
                <button class="control-btn next-btn" onclick="nextNote()">
                    <span>▶</span> Próxima
                </button>
                <button class="control-btn end-btn" onclick="endGame()">
                    <span>⏹</span> Encerrar
                </button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="score">0</div>
                    <div class="stat-label">ACERTOS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="errors">0</div>
                    <div class="stat-label">ERROS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="total">0</div>
                    <div class="stat-label">TOTAL</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="streak">0</div>
                    <div class="stat-label">SEQUÊNCIA</div>
                </div>
            </div>
            
            <div class="instructions">
                <strong>Dicas:</strong> Use os botões ou teclas 1-7 (Dó=1, Si=7)
            </div>
        </div>
    </div>
    
    <!-- Modal de Game Over -->
    <div class="game-over-modal" id="gameOverModal">
        <div class="game-over-content">
            <div class="game-over-title">💀 GAME OVER!</div>
            <div class="game-over-message">
                Você atingiu 5 erros!<br>
                Precisa praticar mais!
            </div>
            
            <div class="game-over-stats">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div style="text-align: center;">
                        <div style="font-size: 0.9em; color: #666;">Acertos</div>
                        <div style="font-size: 1.8em; font-weight: bold; color: #06D6A0;" id="finalScore">0</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 0.9em; color: #666;">Erros</div>
                        <div style="font-size: 1.8em; font-weight: bold; color: #EF476F;" id="finalErrors">0</div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                    Total de notas: <span style="font-weight: bold;" id="finalTotal">0</span>
                </div>
            </div>
            
            <button class="modal-btn restart-btn" onclick="restartGame()">
                🔄 Jogar Novamente
            </button>
            <button class="modal-btn close-btn" onclick="closeModal()">
                ✕ Fechar
            </button>
        </div>
    </div>

    <script>
        // Variáveis do jogo
        const TEMPO_RESPOSTA = 10; // Configuração centralizada
        let currentNote = null;
        let score = 0;
        let errors = 0;
        let total = 0;
        let streak = 0;
        let timer = null;
        let timeLeft = TEMPO_RESPOSTA;
        let gameActive = false;
        let gameOver = false;
        let currentNoteKey = '';
        
        // Mapeamento de notas
        const notesMap = {
            'C': ['c/4', 'c/5', 'c/6'],
            'D': ['d/4', 'd/5', 'd/6'],
            'E': ['e/4', 'e/5'],
            'F': ['f/4', 'f/5'],
            'G': ['g/4', 'g/5'],
            'A': ['a/4', 'a/5'],
            'B': ['b/3', 'b/4']
        };
        
        const noteNames = {
            'C': 'Dó',
            'D': 'Ré',
            'E': 'Mi',
            'F': 'Fá',
            'G': 'Sol',
            'A': 'Lá',
            'B': 'Si'
        };
        
        // Inicializar o jogo
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            nextNote();
            setupKeyboard();
        });
        
        function setupKeyboard() {
            document.addEventListener('keydown', function(event) {
                if (gameOver || !gameActive) return;
                
                const keyMap = {
                    '1': 'C', 'd': 'C', 'D': 'C',
                    '2': 'D', 'r': 'D', 'R': 'D',
                    '3': 'E', 'm': 'E', 'M': 'E',
                    '4': 'F', 'f': 'F', 'F': 'F',
                    '5': 'G', 's': 'G', 'S': 'G',
                    '6': 'A', 'l': 'A', 'L': 'A',
                    '7': 'B', 't': 'B', 'T': 'B',
                    ' ': nextNote,
                    'Enter': nextNote,
                    'Escape': endGame,
                    'e': endGame, 'E': endGame
                };
                
                const action = keyMap[event.key];
                if (action) {
                    if (typeof action === 'function') {
                        action();
                    } else {
                        checkAnswer(action);
                    }
                }
            });
        }
        
        function nextNote() {
            if (gameOver) return;
            
            if (timer) {
                clearInterval(timer);
            }
            
            // Resetar feedback
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            
            // Sortear nova nota
            const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            currentNote = notes[Math.floor(Math.random() * notes.length)];
            
            // Sortear oitava
            const octaves = notesMap[currentNote];
            const selectedOctave = octaves[Math.floor(Math.random() * octaves.length)];
            
            // Criar notação
            createNotation(selectedOctave);
            
            // Atualizar texto
            //document.getElementById('currentNote').textContent = `Nota: ${noteNames[currentNote]}`;

            resetarBarraProgresso();
            iniciarBarraProgresso();
            

            // Resetar timer
            timeLeft = TEMPO_RESPOSTA;
            updateTimerDisplay();
            
            // Iniciar contagem
            gameActive = true;
            timer = setInterval(updateTimer, 1000);
        }
        
function createNotation(noteKey, mostrarNota = true) {
    try {
        const container = document.getElementById('notation');
        container.innerHTML = '';
        
        if (!mostrarNota) {
            // Se não deve mostrar nota, retorna pentagrama vazio
            const renderer = new Vex.Flow.Renderer(container, Vex.Flow.Renderer.Backends.SVG);
            const width = Math.min(window.innerWidth - 60, 400);
            renderer.resize(width, 120);
            const context = renderer.getContext();
            const staveWidth = width - 100;
            
            const stave = new Vex.Flow.Stave(50, 20, staveWidth);
            stave.addClef('treble'); // ou 'bass'
            stave.setContext(context).draw();
            return;
        }
        
        // Código original para mostrar nota
        const renderer = new Vex.Flow.Renderer(container, Vex.Flow.Renderer.Backends.SVG);
        const width = Math.min(window.innerWidth - 60, 400);
        renderer.resize(width, 120);
        const context = renderer.getContext();
        const staveWidth = width - 100;
        
        const stave = new Vex.Flow.Stave(50, 20, staveWidth);
        stave.addClef('treble'); // ou 'bass'
        stave.setContext(context).draw();
        
        const note = new Vex.Flow.StaveNote({
            keys: [noteKey],
            duration: 'w'
        });
        
        const voice = new Vex.Flow.Voice({
            num_beats: 1,
            beat_value: 1,
            resolution: Vex.Flow.RESOLUTION
        });
        
        voice.addTickables([note]);
        
        new Vex.Flow.Formatter()
            .joinVoices([voice])
            .format([voice], staveWidth - 20);
        
        voice.draw(context, stave);
        
    } catch (error) {
        console.error('Erro:', error);
    }
}        
        function updateTimer() {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                gameActive = false;
                handleTimeOut();
            }
        }
        
        function updateTimerDisplay() {
            //const timerEl = document.getElementById('timer');
            //timerEl.textContent = timeLeft;
            
            // Mudar cor conforme tempo
            //if (timeLeft <= 2) {
            //    timerEl.style.color = '#EF476F';
            //} else if (timeLeft <= 3) {
            //    timerEl.style.color = '#FFD166';
            //} else {
            //    timerEl.style.color = '#667eea';
            //}
        }
        
function checkAnswer(userNote) {
    if (gameOver || !gameActive) return;
    
    clearInterval(timer);
    //pararProgresso(); // Se estiver usando barra de progresso
    gameActive = false;
    total++;
    
    // Guardar a nota atual para mostrar depois
    const notaAtualKey = currentNoteKey; // Você precisa armazenar isso
    
    // APAGAR a nota imediatamente
    createNotation(null, false); // Mostra pentagrama vazio
    
    if (userNote === currentNote) {
        // Acerto
        score++;
        streak++;
        
        // Mostrar ✅ por 500ms
        mostrarSimboloNoPentagrama('✅');
        showFeedback('✅ Correto!', true);
        
        // Próxima nota após 500ms
        setTimeout(() => {
            nextNote();
        }, 500);
        
    } else {
        // Erro
        errors++;
        streak = 0;
        
        // Mostrar ❌ por 500ms
        mostrarSimboloNoPentagrama('❌');
        showFeedback(`❌ Errado! Era ${noteNames[currentNote]}`, false);
        
        // Verificar se atingiu 5 erros
        if (errors >= 5) {
            setTimeout(showGameOver, 1500);
        } else {
            // Próxima nota após 500ms
            setTimeout(() => {
                nextNote();
            }, 500);
        }
    }
    
    updateStats();
    pararBarraProgresso()
}        
        function handleTimeOut() {
            gameActive = false;
            errors++;
            streak = 0;
            total++;
            
            showFeedback('⏰ Tempo esgotado!', false);
            
            // Verificar se atingiu 5 erros
            if (errors >= 5) {
                setTimeout(showGameOver, 1500);
            } else {
                // Próxima nota após 2 segundos
                setTimeout(nextNote, 2000);
            }
            
            updateStats();
            pararBarraProgresso()
        }
        
        function showFeedback(message, isCorrect) {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.textContent = message;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'error'}`;
        }
        
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('Acertos').textContent = score;
            document.getElementById('errors').textContent = errors;
            if (errors != 0) {
                document.getElementById('erro' + errors).classList.remove('mostra-erro');
            }
            document.getElementById('total').textContent = total;
            document.getElementById('streak').textContent = streak;
            
            // Atualizar aviso de erros
            //const errorWarning = document.getElementById('errorWarning');
            const errorCount = document.getElementById('errorCount');
            
            errorCount.textContent = errors;
            
            //if (errors >= 3) {
            //    errorWarning.style.display = 'block';
            //} else {
            //    errorWarning.style.display = 'none';
            //}
            
            //if (errors >= 4) {
            //    errorWarning.style.background = '#FFEBEE';
            //    errorWarning.style.borderLeftColor = '#F44336';
            //} else if (errors >= 3) {
            //    errorWarning.style.background = '#FFF3E0';
            //    errorWarning.style.borderLeftColor = '#FF9800';
            //}
        }
        
        function showGameOver() {
            gameOver = true;
            clearInterval(timer);
            
            // Atualizar estatísticas no modal
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalErrors').textContent = errors;
            document.getElementById('finalTotal').textContent = total;
            
            // Mostrar modal
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        function endGame() {
            if (!gameOver) {
                showGameOver();
            }
        }
        
        function restartGame() {
            // Resetar variáveis
            score = 0;
            errors = 0;
            total = 0;
            streak = 0;
            gameOver = false;
            document.getElementById('erro1').classList.add('mostra-erro');
            document.getElementById('erro2').classList.add('mostra-erro');
            document.getElementById('erro3').classList.add('mostra-erro');
            document.getElementById('erro4').classList.add('mostra-erro');
            document.getElementById('erro5').classList.add('mostra-erro');

            // Fechar modal
            closeModal();
            
            // Atualizar estatísticas
            updateStats();
            
            // Iniciar novo jogo
            nextNote();
        }
        
        function closeModal() {
            document.getElementById('gameOverModal').style.display = 'none';
        }
        
        // Forçar orientação paisagem em dispositivos móveis
        function lockOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {
                    // Ignorar erro se o navegador não permitir
                });
            }
        }
        
        // Tentar bloquear orientação quando a página carregar
        window.addEventListener('load', function() {
            if (window.innerHeight > window.innerWidth) {
                // Está em retrato, mostrar mensagem
                setTimeout(lockOrientation, 100);
            }
        });
        
        // Atualizar orientação quando a janela mudar de tamanho
        window.addEventListener('resize', function() {
            createNotation(); // Recriar notação para ajustar tamanho
        });

function mostrarSimboloNoPentagrama(simbolo) {
    const container = document.getElementById('notation');
    container.innerHTML = '';
    
    // Criar um SVG simples com o símbolo
    const renderer = new Vex.Flow.Renderer(container, Vex.Flow.Renderer.Backends.SVG);
    const width = Math.min(window.innerWidth - 60, 400);
    renderer.resize(width, 120);
    const context = renderer.getContext();
    
    // Desenhar pentagrama vazio
    const staveWidth = width - 100;
    const stave = new Vex.Flow.Stave(50, 20, staveWidth);
    stave.addClef('treble'); // ou 'bass'
    stave.setContext(context).draw();
    
    // Adicionar o símbolo grande no centro
    const svg = container.querySelector('svg');
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    
    text.setAttribute('x', width / 2);
    text.setAttribute('y', 70); // Centro vertical
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-size', '60');
    text.setAttribute('font-weight', 'bold');
    
    if (simbolo === '✅') {
        text.setAttribute('fill', '#06D6A0'); // Verde para acerto
    } else {
        text.setAttribute('fill', '#EF476F'); // Vermelho para erro
    }
    
    text.textContent = simbolo;
    svg.appendChild(text);
}
const TEMPO_TOTAL = 10;
let progressInterval = null;

function iniciarBarraProgresso() {
    pararBarraProgresso();
    
    const progressBar = document.getElementById('progressBar');
    let tempo = TEMPO_TOTAL;
    
    progressBar.style.width = '100%';
    progressBar.className = 'progress-bar';
    
    progressInterval = setInterval(() => {
        tempo--;
        const porcentagem = (tempo / TEMPO_TOTAL) * 100;
        
        progressBar.style.width = porcentagem + '%';
        
        // Mudar cor
        if (tempo <= 3) {
            progressBar.className = 'progress-bar danger';
        } else if (tempo <= 5) {
            progressBar.className = 'progress-bar warning';
        }
        
        if (tempo <= 0) {
            pararBarraProgresso();
        }
    }, 1000);
}

function pararBarraProgresso() {
    if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
    }
}

function resetarBarraProgresso() {
    pararBarraProgresso();
    const progressBar = document.getElementById('progressBar');
    progressBar.style.width = '100%';
    progressBar.className = 'progress-bar';
}
