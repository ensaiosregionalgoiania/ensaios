<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🎵 Treino Musical</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            min-height: 100vh;
            transform: rotate(0deg);
        }
        
        /* Forçar orientação paisagem */
        @media screen and (orientation: portrait) {
            body::before {
                content: "📱 Gire seu celular para horizontal e aumente o volume do celular";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5em;
                text-align: center;
                padding: 20px;
                z-index: 1000;
                font-weight: bold;
            }
            
            .container {
                display: none;
            }
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        h1 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .game-area {
            width: 100%;
        }
        
        .pentagrama-container {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        #notation {
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 85px;
        }
        
        .timer-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background: #f0f2ff;
            border-radius: 8px;
        }
        
        .timer-box {
            width: 80%; 
            min-width: 100px; 
            border: 1px solid #0a0321; 
            display: flex; 
            box-sizing: border-box;
        }
        
        .timer {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }
        
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .note-btn {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        
        .note-btn:active {
            transform: scale(0.95);
        }
        
        .note-do { background: linear-gradient(45deg, #FF6B6B, #FF8E8E); }
        .note-re { background: linear-gradient(45deg, #4ECDC4, #44A08D); }
        .note-mi { background: linear-gradient(45deg, #FFD166, #FFB347); }
        .note-fa { background: linear-gradient(45deg, #06D6A0, #06A678); }
        .note-sol { background: linear-gradient(45deg, #118AB2, #0A6C8F); }
        .note-la { background: linear-gradient(45deg, #EF476F, #D43A5E); }
        .note-si { background: linear-gradient(45deg, #9D4EDD, #7B2CBF); }
        
        .mostra-erro {
            opacity: 0.5; 
            filter: grayscale(100%)
        }

        /* ADICIONE ESTES ESTILOS */
        .progress-container {
            width: 80%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid #ddd;
        }

        .progress-bar {
            height: 100%;
            width: 80%;
            background: #4CAF50;
            border-radius: 5px;
            transition: width 1s linear;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        .progress-bar.warning {
            background: #FF9800;
            box-shadow: 0 0 5px rgba(255, 152, 0, 0.3);
        }

        .progress-bar.danger {
            background: #F44336;
            box-shadow: 0 0 5px rgba(244, 67, 54, 0.3);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }

        /* Botões de clave ativos */
        .clave-active {
            background: linear-gradient(45deg, #FFD166, #FFB347) !important;
            border: 3px solid #333 !important;
            transform: scale(1.05);
            display: none
        }
        
    </style>
</head>

<body>
    <div class="container">
        <div class="game-area">
            <div class="pentagrama-container">
                <div id="notation"></div>
            </div>
            
            <div class="timer-section">
                <div class="timer-box" style="width: 20%;">
                    <div style="width: 100%; padding: 5px; border: 1px solid #0a0321; text-align: left; box-sizing: border-box;">
                        <div style="font-size: 0.9em; font-weight: bold;">Tempo</div>
                        <div class="progress-container" style="width: 100%; border: 1px solid #0a0321;">
                            <div id="progressBar" class="progress-bar" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
                <div class="timer-box" style="width: 30%;">
                    <div style="width: 30%; padding: 5px; border: 1px solid #0a0321; text-align: left; box-sizing: border-box;">
                        <div style="font-size: 0.9em; font-weight: bold;">Acertos</div>
                        <div style="display: flex; gap: 8px;">
                            <span id="Acertos" style="font-size:20px; text-align: center; font-weight: bold;"><b>0</b></span>
                        </div>
                    </div>
                    <div style="width: 70%; padding: 10px; border: 1px solid #0a0321; display: flex; flex-direction: column; align-items: flex-start; gap: 5px;">
                        <div style="font-size: 0.9em; font-weight: bold;">Erros</div>
                        <div style="display: flex; gap: 8px;">
                            <span id="erro1" class="mostra-erro">❌</span>
                            <span id="erro2" class="mostra-erro">❌</span>
                            <span id="erro3" class="mostra-erro">❌</span>
                            <span id="erro4" class="mostra-erro">❌</span>
                            <span id="erro5" class="mostra-erro">❌</span>
                        </div>
                    </div>                    
                </div> 
                
                <div class="timer-box" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 50%; border: 1px solid #0a0321;">
                    <button class="note-btn note-mi clave-active" id="claveSOL" style="width: 33%; font-size: 30px; font-weight: bold; color: black;" onclick="MudaClave(this.id)">𝄞</button>
                    <button class="note-btn note-mi" id="claveFA" style="width: 33%; font-size: 30px; font-weight: bold; color: black;" onclick="MudaClave(this.id)">𝄢</button>
                    <button class="note-btn note-mi" id="claveDO" style="width: 33%; font-size: 30px; font-weight: bold; color: black;" onclick="MudaClave(this.id)">𝄡</button>
                </div>            
            </div>            
            
            <div class="notes-grid">
                <button class="note-btn note-sol" onclick="checkAnswer('C')">Dó</button>
                <button class="note-btn note-sol" onclick="checkAnswer('D')">Ré</button>
                <button class="note-btn note-sol" onclick="checkAnswer('E')">Mi</button>
                <button class="note-btn note-sol" onclick="checkAnswer('F')">Fá</button>
                <button class="note-btn note-sol" onclick="checkAnswer('G')">Sol</button>
                <button class="note-btn note-sol" onclick="checkAnswer('A')">Lá</button>
                <button class="note-btn note-sol" onclick="checkAnswer('B')">Si</button>
            </div>
        </div>
    </div>
    
    <!-- Modal de Game Over -->
    <div class="game-over-modal" id="gameOverModal">
        <div class="game-over-content">
            <div class="game-over-title">💀 GAME OVER!</div>
            <div class="game-over-message">
                Você atingiu 5 erros!<br>
                Precisa praticar mais!
            </div>
            
            <div class="game-over-stats">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div style="text-align: center;">
                        <div style="font-size: 0.9em; color: #666;">Acertos</div>
                        <div style="font-size: 1.8em; font-weight: bold; color: #06D6A0;" id="finalScore">0</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 0.9em; color: #666;">Erros</div>
                        <div style="font-size: 1.8em; font-weight: bold; color: #EF476F;" id="finalErrors">0</div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                    Total de notas: <span style="font-weight: bold;" id="finalTotal">0</span>
                </div>
            </div>
            
            <button class="modal-btn restart-btn" onclick="restartGame()">
                🔄 Jogar Novamente
            </button>
            <button class="modal-btn close-btn" onclick="closeModal()">
                ✕ Fechar
            </button>
        </div>
    </div>

    <script>
        // Variáveis do jogo
        const TEMPO_RESPOSTA = 10;
        let currentNote = null;
        let score = 0;
        let errors = 0;
        let total = 0;
        let streak = 0;
        let timer = null;
        let timeLeft = TEMPO_RESPOSTA;
        let gameActive = false;
        let gameOver = false;
        let Clave = "SOL"; // Clave padrão
        
        // Mapeamento de notas para cada clave
        const notasPorClave = {
            'SOL': { // Clave de Sol
                'C': ['c/4', 'c/5', 'c/6'],
                'D': ['d/4', 'd/5', 'd/6'],
                'E': ['e/4', 'e/5'],
                'F': ['f/4', 'f/5'],
                'G': ['g/4', 'g/5'],
                'A': ['a/4', 'a/5'],
                'B': ['b/3', 'b/4']
            },
            'FA': { // Clave de Fá
                'C': ['c/4', 'c/5'],
                'D': ['d/4', 'd/5'],
                'E': ['e/4', 'e/5'],
                'F': ['f/4', 'f/5'],
                'G': ['g/4', 'g/5'],
                'A': ['a/4', 'a/5'],
                'B': ['b/3', 'b/4']
            },
            'DO': { // Clave de Dó (na 3ª linha)
                'C': ['c/4', 'c/5'],
                'D': ['d/4', 'd/5'],
                'E': ['e/4', 'e/5'],
                'F': ['f/4', 'f/5'],
                'G': ['g/4', 'g/5'],
                'A': ['a/4', 'a/5'],
                'B': ['b/4', 'b/5']
            }
        };
        
        const noteNames = {
            'C': 'Dó',
            'D': 'Ré',
            'E': 'Mi',
            'F': 'Fá',
            'G': 'Sol',
            'A': 'Lá',
            'B': 'Si'
        };
        
        const escala = [
            ["B2", 123.47],
            ["C3", 130.81],
            ["D3", 146.83],
            ["E3", 164.81],
            ["F3", 174.61],
            ["G3", 196.00],
            ["A3", 220.00],
            ["B3", 246.94],
            ["C4", 261.63],
            ["D4", 293.66],
            ["E4", 329.63],
            ["F4", 349.23],
            ["G4", 392.00],
            ["A4", 440.00],
            ["B4", 493.88],
            ["C5", 523.25],
            ["D5", 587.33],
            ["E5", 659.25],
            ["F5", 698.46],
            ["G5", 783.99],
            ["A5", 880.00],
            ["B5", 987.77],
            ["C6", 1046.50],
            ["D6", 1174.66]
        ];
       
        // Inicializar o jogo
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            nextNote();
            setupKeyboard();
        });
        
        function setupKeyboard() {
            document.addEventListener('keydown', function(event) {
                if (gameOver || !gameActive) return;
                
                const keyMap = {
                    '1': 'C', 'd': 'C', 'D': 'C',
                    '2': 'D', 'r': 'D', 'R': 'D',
                    '3': 'E', 'm': 'E', 'M': 'E',
                    '4': 'F', 'f': 'F', 'F': 'F',
                    '5': 'G', 's': 'G', 'S': 'G',
                    '6': 'A', 'l': 'A', 'L': 'A',
                    '7': 'B', 't': 'B', 'T': 'B',
                    ' ': nextNote,
                    'Enter': nextNote,
                    'Escape': endGame,
                    'e': endGame, 'E': endGame
                };
                
                const action = keyMap[event.key];
                if (action) {
                    if (typeof action === 'function') {
                        action();
                    } else {
                        checkAnswer(action);
                    }
                }
            });
        }
        
        function nextNote() {
            if (gameOver) return;
            
            if (timer) {
                clearInterval(timer);
            }
            
            // Sortear nova nota
            const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            currentNote = notes[Math.floor(Math.random() * notes.length)];
            
            // Sortear oitava baseada na clave atual
            const octaves = notasPorClave[Clave][currentNote];
            const selectedOctave = octaves[Math.floor(Math.random() * octaves.length)];
            
            // Criar notação com a clave atual
            createNotation(selectedOctave);
            
            // Tocar som da nota
            let frequencia = pesquisarFrequencia(selectedOctave.toUpperCase().replace("/", ""));
            if (frequencia) tocarNota(frequencia);

            resetarBarraProgresso();
            iniciarBarraProgresso();

            // Resetar timer
            timeLeft = TEMPO_RESPOSTA;
            
            // Iniciar contagem
            gameActive = true;
            timer = setInterval(updateTimer, 1000);
        }
        
        function createNotation(noteKey, mostrarNota = true) {
            try {
                const container = document.getElementById('notation');
                container.innerHTML = '';
                
                if (!mostrarNota) {
                    // Pentagrama vazio
                    const renderer = new Vex.Flow.Renderer(container, Vex.Flow.Renderer.Backends.SVG);
                    const width = Math.min(window.innerWidth - 60, 400);
                    renderer.resize(width, 70);
                    const context = renderer.getContext();
                    const staveWidth = width - 100;
                    
                    const stave = new Vex.Flow.Stave(50, 12, staveWidth);
                    stave.addClef(getClefName(Clave));
                    stave.setContext(context).draw();
                    return;
                }
                
                const renderer = new Vex.Flow.Renderer(container, Vex.Flow.Renderer.Backends.SVG);
                const width = Math.min(window.innerWidth - 60, 400);
                renderer.resize(width, 120);
                const context = renderer.getContext();
                const staveWidth = width - 100;
                
                const stave = new Vex.Flow.Stave(50, 20, staveWidth);
                stave.addClef(getClefName(Clave));
                stave.setContext(context).draw();
                
                const note = new Vex.Flow.StaveNote({
                    keys: [noteKey],
                    duration: 'w'
                });
                
                const voice = new Vex.Flow.Voice({
                    num_beats: 1,
                    beat_value: 1,
                    resolution: Vex.Flow.RESOLUTION
                });
                
                voice.addTickables([note]);
                
                new Vex.Flow.Formatter()
                    .joinVoices([voice])
                    .format([voice], staveWidth - 20);
                
                voice.draw(context, stave);
                
            } catch (error) {
                console.error('Erro ao criar notação:', error);
            }
        }
        
        function getClefName(clave) {
            switch(clave) {
                case 'SOL': return 'treble';
                case 'FA': return 'bass';
                case 'DO': return 'alto'; // Clave de Dó na 3ª linha
                default: return 'treble';
            }
        }
        
        function updateTimer() {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                gameActive = false;
                handleTimeOut();
            }
        }
        
        function checkAnswer(userNote) {
            let Notas = "ABCDEFGAB"
            let Posicao = 0
            let novaNota = ""
            if (Clave === "FA") {
                posicao = Notas.indexOf(currentNote) + 2;
                currentNote = Notas.charAt(posicao); 
            } else if (Clave === "DO") {
                posicao = Notas.indexOf(currentNote) + 1;
                currentNote = Notas.charAt(posicao); 
            }
            if (gameOver || !gameActive) return;
            
            clearInterval(timer);
            gameActive = false;
            total++;
            
            // Apagar a nota imediatamente
            createNotation(null, false);

            if (userNote === currentNote) {
                // Acerto
                score++;
                streak++;
                
                mostrarSimboloNoPentagrama('✅');
                
                setTimeout(() => {
                    nextNote();
                }, 500);
                
            } else {
                // Erro
                errors++;
                streak = 0;
                
                mostrarSimboloNoPentagrama('❌');
                
                if (errors >= 5) {
                    setTimeout(showGameOver, 1500);
                } else {
                    setTimeout(() => {
                        nextNote();
                    }, 500);
                }
            }
            
            updateStats();
            pararBarraProgresso();
        }
        
        function handleTimeOut() {
            gameActive = false;
            errors++;
            streak = 0;
            total++;
            
            if (errors >= 5) {
                setTimeout(showGameOver, 1500);
            } else {
                setTimeout(nextNote, 2000);
            }
            
            updateStats();
            pararBarraProgresso();
        }
        
        function updateStats() {
            document.getElementById('Acertos').textContent = score;
            if (errors != 0) {
                document.getElementById('erro' + errors).classList.remove('mostra-erro');
            }
        }
        
        function showGameOver() {
            gameOver = true;
            clearInterval(timer);
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalErrors').textContent = errors;
            document.getElementById('finalTotal').textContent = total;
            
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        function endGame() {
            if (!gameOver) {
                showGameOver();
            }
        }
        
        function restartGame() {
            score = 0;
            errors = 0;
            total = 0;
            streak = 0;
            gameOver = false;
            
            for (let i = 1; i <= 5; i++) {
                document.getElementById('erro' + i).classList.add('mostra-erro');
            }

            closeModal();
            updateStats();
            nextNote();
        }
        
        function closeModal() {
            document.getElementById('gameOverModal').style.display = 'none';
        }
        
        function mostrarSimboloNoPentagrama(simbolo) {
            const container = document.getElementById('notation');
            container.innerHTML = '';
            
            const renderer = new Vex.Flow.Renderer(container, Vex.Flow.Renderer.Backends.SVG);
            const width = Math.min(window.innerWidth - 60, 400);
            renderer.resize(width, 120);
            const context = renderer.getContext();
            
            const staveWidth = width - 100;
            const stave = new Vex.Flow.Stave(50, 20, staveWidth);
            stave.addClef(getClefName(Clave));
            stave.setContext(context).draw();
            
            const svg = container.querySelector('svg');
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            
            text.setAttribute('x', width / 2);
            text.setAttribute('y', 70);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('font-size', '60');
            text.setAttribute('font-weight', 'bold');
            
            if (simbolo === '✅') {
                text.setAttribute('fill', '#06D6A0');
            } else {
                text.setAttribute('fill', '#EF476F');
            }
            
            text.textContent = simbolo;
            svg.appendChild(text);
        }
        
        const TEMPO_TOTAL = 10;
        let progressInterval = null;

        function iniciarBarraProgresso() {
            pararBarraProgresso();
            
            const progressBar = document.getElementById('progressBar');
            let tempo = TEMPO_TOTAL;
            
            progressBar.style.width = '100%';
            progressBar.className = 'progress-bar';
            
            progressInterval = setInterval(() => {
                tempo--;
                const porcentagem = (tempo / TEMPO_TOTAL) * 100;
                
                progressBar.style.width = porcentagem + '%';
                
                if (tempo <= 3) {
                    progressBar.className = 'progress-bar danger';
                } else if (tempo <= 5) {
                    progressBar.className = 'progress-bar warning';
                }
                
                if (tempo <= 0) {
                    pararBarraProgresso();
                }
            }, 1000);
        }

        function pararBarraProgresso() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function resetarBarraProgresso() {
            pararBarraProgresso();
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '100%';
            progressBar.className = 'progress-bar';
        }

        function tocarNota(frequencia) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(frequencia, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.start();
            
            setTimeout(() => {
                oscillator.stop();
            }, 1000);
        }
        
        function pesquisarFrequencia(nota) {
            const encontrado = escala.find(item => item[0] === nota);
            return encontrado ? encontrado[1] : null;
        }

        function MudaClave(claveTemp) {
            // Remover classe ativa de todos os botões
            document.getElementById('claveSOL').style.display = "block";
            document.getElementById('claveFA').style.display = "block";
            document.getElementById('claveDO').style.display = "block";
            // Adicionar classe ativa ao botão clicado
            document.getElementById(claveTemp).style.display = "none";
            
            // Mudar a clave
            Clave = claveTemp.replace("clave","");
            
            // Recriar a nota atual com a nova clave
            if (currentNote) {
                const octaves = notasPorClave[Clave][currentNote];
                const selectedOctave = octaves[Math.floor(Math.random() * octaves.length)];
                createNotation(selectedOctave);
            }
        }

    </script>
