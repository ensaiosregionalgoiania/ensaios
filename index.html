<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensaio Local por Data</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        #data-select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        #btn-listar {
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #btn-listar:hover {
            background-color: #2980b9;
        }
        
        .error {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #3498db;
            color: white;
            position: sticky;
            top: 0;
        }
        
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        
        .no-events {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-style: italic;
        }
        
        @media (min-width: 600px) {
            .container {
                max-width: 800px;
                padding: 20px;
            }
            
            .input-group {
                flex-direction: row;
                align-items: center;
            }
            
            label {
                margin-right: 10px;
                margin-bottom: 0;
                width: 120px;
            }
            
            #data-select {
                flex-grow: 1;
                margin-right: 10px;
                margin-bottom: 0;
            }
            
            #btn-listar {
                width: auto;
            }
        }

        tr.clickable {
            cursor: pointer; /* Muda o cursor para a "mãozinha" */
            position: relative; /* Para o tooltip funcionar */

        }
        tr.clickable:hover::after {
            content: "Clique para acessar a localização";
            position: absolute;
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 100;        } 
    
         .tooltip {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .visible {
            opacity: 1;
        }
        .filtros {
            background-color: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .filtros h3 {
            margin-top: 0;
            font-size: 1.1rem;
            text-align: center;
        }
        .filtros-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .filtros label {
            background-color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .filtros input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 6px;
        }
    
    </style>

</head>

        // Função para formatar data como dd/mm/aaaa
        function formatarData(data) {
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const ano = data.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        // Função para obter o nome do dia da semana
        function getDiaSemana(data) {
            const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            return dias[data.getDay()];
        }

        // Função para preencher o select com as datas
        function preencherSelectDatas() {
            const select = document.getElementById('data-select');
            const hoje = new Date();
            
            // Limpa o select
            select.innerHTML = '';
            
            // Adiciona as opções para os próximos 15 dias (hoje + 14 dias)
            for (let i = 0; i < 20; i++) {
                const data = new Date(hoje);
                data.setDate(hoje.getDate() + i);
                
                const dataFormatada = formatarData(data);
                const diaSemana = getDiaSemana(data);
                
                const option = document.createElement('option');
                option.value = dataFormatada;
                option.textContent = `${dataFormatada} (${diaSemana})`;
                
                // Seleciona a data atual por padrão
                if (i === 0) {
                    option.selected = true;
                }
                
                select.appendChild(option);
            }
        }

        // Função CORRIGIDA para calcular a data do evento
        function calcularDataEvento(descricao, mes, ano) {
            // Extrai a ordem (1º, 2º, etc.) e o dia da semana
            const match = descricao.match(/(\d+)[ºª]\s+([^;]+)/i);
            if (!match) return null;
            
            const ordem = parseInt(match[1]);
            let diaSemana = match[2].trim().toUpperCase();
            
            // Padroniza o nome do dia da semana
            diaSemana = diaSemana
                .replace(/-/g, ' ')
                .replace(/FEIRA/g, '')
                .trim();
            
            // Mapeamento dos dias da semana
            const diasMap = {
                'DOMINGO': 0,
                'SEGUNDA': 1,
                'TERÇA': 2, 'TERCA': 2,
                'QUARTA': 3,
                'QUINTA': 4,
                'SEXTA': 5,
                'SÁBADO': 6, 'SABADO': 6
            };

            const diaNum = diasMap[diaSemana];
            if (diaNum === undefined) return null;

            // Calcula a data correta
            let data = new Date(ano, mes - 1, 1);
            let contador = 0;
            
            while (data.getMonth() === mes - 1) {
                if (data.getDay() === diaNum) {
                    contador++;
                    if (contador === ordem) {
                        return new Date(data);
                    }
                }
                data.setDate(data.getDate() + 1);
            }
            
            return null;
        }

        // Função para gerar a tabela
        function gerarTabela(dataInformada) {
            const tabela = document.querySelector('#tabela-eventos tbody');
            tabela.innerHTML = '';

            const [diaStr, mesStr, anoStr] = dataInformada.split('/');
            const dia = parseInt(diaStr);
            const mes = parseInt(mesStr);
            const ano = parseInt(anoStr);
            
            let encontrouEventos = false;

            dados.forEach(item => {
                try {

                    const [local, cidade, descricaoDia, horario, localizacao] = item.split(';');
                    const dataEvento = calcularDataEvento(descricaoDia, mes, ano);
                    if (dataEvento && 
                        dataEvento.getDate() === dia &&
                        dataEvento.getMonth() === mes - 1 &&
                        dataEvento.getFullYear() === ano) {
                        
                        const dataFormatada = dataInformada;
                        const row = tabela.insertRow();
                        row.style.cursor = "pointer";

                        row.className = "clickable"; // Adiciona a classe para o cursor
                        row.onclick = () => window.open("https://maps.app.goo.gl/" + localizacao, "_blank"); // Redireciona ao clicar

                        row.insertCell(0).innerHTML = local;
                        row.insertCell(1).textContent = cidade;
                        row.insertCell(2).textContent = horario;
                        
                        encontrouEventos = true;
                    }
                } catch (e) {
                    console.error("Erro ao processar item:", item, e);
                }
            });

            if (!encontrouEventos) {
                const row = tabela.insertRow();
                const cell = row.insertCell(0);
                cell.colSpan = 4;
                cell.textContent = "Nenhum ensaio encontrado para esta data.";
                cell.className = "no-events";
            } else {
                MostrarMsg()
            }
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            preencherSelectDatas();
            const dataSelecionada = document.getElementById('data-select').value;
            gerarTabela(dataSelecionada);
            
            // Evento do botão "Listar" (mantido para consistência, mas não é mais necessário)
            document.getElementById('btn-listar').addEventListener('click', () => {
                const dataSelecionada = document.getElementById('data-select').value;
                gerarTabela(dataSelecionada);
            });
            
            // Atualiza automaticamente quando muda a seleção
            document.getElementById('data-select').addEventListener('change', (e) => {
                gerarTabela(e.target.value);
            });
        });

        function MostrarMsg()  { 
            const tooltip = document.getElementById('infoTooltip');
            
            // Mostra o tooltip
            tooltip.classList.add('visible');
            
            // Esconde após 1 segundo
            setTimeout(() => {
                tooltip.classList.remove('visible');
            }, 2000);


         }
