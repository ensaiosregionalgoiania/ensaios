        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            background-color: white;
            padding: 8px 15px;
            border-radius: 6px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;

        .radio-option:hover {
            border-color: #3498db;
            background-color: #f8f9fa;
        }
        .radio-option input {

        }
        .radio-option label {

        .input-group {

            align-items: center;

        }

            text-align: left;

        #convite-overlay {

            position: fixed;
            top: 0;
            left: 0;

            align-items: center;
            padding: 10px;

        }

            width: 95%;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            aspect-ratio: 9 / 16;
            min-height: 450px;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            cursor: default;
        }

        /* Classes base para os campos do convite - serão sobrescritas pelo JavaScript */
        .convite-campo {
            position: absolute;
            pointer-events: none;
        }
        .convite-campo a {
            pointer-events: auto;
        }

        .btn-fechar-convite {
            position: absolute;
            top: 10px;
            right: 10px;

            color: white;

            border-radius: 50%;

            height: 35px;
            font-size: 18px;

            align-items: center;

            background: #c0392b;
            transform: scale(1.1);
        }

        .botoes-convite {
            position: absolute;
            z-index: 10;

            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .btn-acao-convite {

            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;

            flex: 1;

            max-width: 160px;
            text-align: center;
        }
        .btn-acao-convite:hover {
            transform: scale(1.05);

        }
        .btn-compartilhar { 
            background: #25D366; 
        }
        .btn-fechar { 
            background: #e74c3c; 
        }

        /* ===== TELA DE AGUARDE ===== */
        #aguarde-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);

            justify-content: center;
            align-items: center;
            flex-direction: column;

        #aguarde-overlay.ativo {
            display: flex;
        }
        .aguarde-box {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);

        }
        .aguarde-box h2 {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 22px;
        }
        .aguarde-box p {
            color: #666;
            margin: 0 0 20px 0;
            font-size: 14px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e9ecef;
            border-top: 5px solid #25D366;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

            body * { visibility: hidden; }

                left: 0;
                top: 0;
                width: 100%;

                padding: 10px;

            th { background-color: #ddd !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            tr:nth-child(even) { background-color: transparent !important; }

    function isTodos(termo) {

    function TiraAcento(texto) {
        if (!texto) return '';
        return String(texto).normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[ºª]/g, '')
            .replace(/[^\w\s]/g, ' ')
            .replace(/\s+/g, ' ')
            .toLowerCase()
            .trim();
    }

    function formatarData(data) {
        const dia = String(data.getDate()).padStart(2, '0');
        const mes = String(data.getMonth() + 1).padStart(2, '0');
        const ano = data.getFullYear();
        return `${dia}/${mes}/${ano}`;
    }

    function dataString(dataFormatada) {
        const partes = dataFormatada.split('/');
        const dia = partes[0];
        const mes = parseInt(partes[1]) - 1;
        const meses = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
        return `${dia} ${meses[mes]}`;
    }

    function getDiaSemana(data) {
        const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
        let NumeroSemana = "";
        if (data.getDate() <= 7) NumeroSemana = "1";
        else if (data.getDate() <= 14) NumeroSemana = "2";
        else if (data.getDate() <= 21) NumeroSemana = "3";
        else if (data.getDate() <= 28) NumeroSemana = "4";
        else NumeroSemana = "5";
        let Ordem = (data.getDay() == 0 || data.getDay() == 6) ? "º" : "ª";
        return NumeroSemana + Ordem + " " + dias[data.getDay()];
    }

    function proximoMesAno(proximoMes, proximoAno) {
        proximoMes = parseInt(proximoMes) + 1;
        if (proximoMes > 12) { proximoMes = 1; proximoAno = proximoAno + 1; }
        return proximoMes + ";" + proximoAno;
    }

    function calcularDataEvento(descricao, mes, ano) {
        const match = descricao.match(/(\d+)[ºª]\s+([^;]+)/i);
        if (!match) return null;
        const ordem = parseInt(match[1]);
        let diaSemana = match[2].trim().toUpperCase();
        diaSemana = diaSemana.replace(/-/g, ' ').replace(/FEIRA/g, '').trim();
        const diasMap = {
            'DOMINGO': 0, 'SEGUNDA': 1, 'TERÇA': 2, 'TERCA': 2,
            'QUARTA': 3, 'QUINTA': 4, 'SEXTA': 5, 'SÁBADO': 6, 'SABADO': 6
        };
        const diaNum = diasMap[diaSemana];
        if (diaNum === undefined) return null;
        let data = new Date(ano, mes - 1, 1);
        let contador = 0;
        while (data.getMonth() === mes - 1) {
            if (data.getDay() === diaNum) {
                contador++;
                if (contador === ordem) return new Date(data);
            }
            data.setDate(data.getDate() + 1);
        }
        return null;
    }

    function deveExibirMes(mes, configMeses) {
        if (!configMeses || configMeses === 'T') return true;
        if (configMeses === 'P') return mes % 2 === 0;
        if (configMeses === 'I') return mes % 2 === 1;
        if (configMeses === '3M1') return mes % 3 === 1;
        if (configMeses === '3M2') return mes % 3 === 2;
        if (configMeses === '3M3') return mes % 3 === 0;
        const mesesPermitidos = configMeses.split('!').map(m => parseInt(m));
        return mesesPermitidos.includes(mes);
    }

    function calcularProximaData(descricaoDia, meses) {
        let hoje = new Date(new Date().setHours(0,0,0,0));
        const mesAtual = hoje.getMonth() + 1;
        const anoAtual = hoje.getFullYear();
        let proximoMes = mesAtual;
        let proximoAno = anoAtual;
        let dataEvento = calcularDataEvento(descricaoDia, proximoMes, proximoAno);
        if (dataEvento === null) {
            descricaoDia = descricaoDia.replace("5", "4");
            dataEvento = calcularDataEvento(descricaoDia, proximoMes, proximoAno);
        }
        if (dataEvento && dataEvento < hoje) {
            const MesAno = proximoMesAno(proximoMes, proximoAno);
            const nextMesAno = MesAno.split(';');
            proximoMes = parseInt(nextMesAno[0]);
            proximoAno = parseInt(nextMesAno[1]);
        }
        if (meses === "I") {
            while (proximoMes % 2 === 0) {
                const MesAno = proximoMesAno(proximoMes, proximoAno);
                const nextMesAno = MesAno.split(';');
                proximoMes = parseInt(nextMesAno[0]);
                proximoAno = parseInt(nextMesAno[1]);
            }
        } else if (meses === "P") {
            while (proximoMes % 2 === 1) {
                const MesAno = proximoMesAno(proximoMes, proximoAno);
                const nextMesAno = MesAno.split(';');
                proximoMes = parseInt(nextMesAno[0]);
                proximoAno = parseInt(nextMesAno[1]);
            }
        } else if (meses === "3M1") {
            while (!(proximoMes == 1 || proximoMes == 4 || proximoMes == 7 || proximoMes == 10)) {
                const MesAno = proximoMesAno(proximoMes, proximoAno);
                const nextMesAno = MesAno.split(';');
                proximoMes = parseInt(nextMesAno[0]);
                proximoAno = parseInt(nextMesAno[1]);
            }
        } else if (meses === "3M2") {
            while (!(proximoMes == 2 || proximoMes == 5 || proximoMes == 8 || proximoMes == 11)) {
                const MesAno = proximoMesAno(proximoMes, proximoAno);
                const nextMesAno = MesAno.split(';');
                proximoMes = parseInt(nextMesAno[0]);
                proximoAno = parseInt(nextMesAno[1]);
            }
        } else if (meses === "3M3") {
            while (!(proximoMes == 3 || proximoMes == 6 || proximoMes == 9 || proximoMes == 12)) {
                const MesAno = proximoMesAno(proximoMes, proximoAno);
                const nextMesAno = MesAno.split(';');
                proximoMes = parseInt(nextMesAno[0]);
                proximoAno = parseInt(nextMesAno[1]);
            }
        }
        dataEvento = calcularDataEvento(descricaoDia, proximoMes, proximoAno);
        return dataEvento;
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function getLocation() {
        return new Promise((resolve) => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        minhaLat = position.coords.latitude;
                        minhaLon = position.coords.longitude;
                        resolve({ minhaLat, minhaLon });
                    },
                    (error) => {
                        console.error(error);
                        usarLocalizacaoPadrao();
                        resolve({ minhaLat, minhaLon });
                    }
                );
            } else {
                usarLocalizacaoPadrao();
                resolve({ minhaLat, minhaLon });
            }
        });
    }

    function ordenarTabelaAtual(inverter = true) {
        const tabela = document.getElementById('tabela-eventos');
        const tbody = tabela.querySelector('tbody');
        const eventosComDetalhes = [];

        tbody.querySelectorAll('tr[id^="evento-"]').forEach(linha => {
            const idNum = linha.id.replace('evento-', '');
            const detalhes = document.getElementById(`detalhes-${idNum}`);
            eventosComDetalhes.push({ evento: linha, detalhes });
        });

        const regional = document.getElementById('consulta-encarregado-regional').checked;

        eventosComDetalhes.sort((a, b) => {
            let valorA = 0;
            let valorB = 0;

            if (!regional) {
                valorA = parseFloat(a.evento.cells[2].textContent.replace(',', '.')) || 0;
                valorB = parseFloat(b.evento.cells[2].textContent.replace(',', '.')) || 0;
            } else {
                const partesA = a.evento.cells[3].textContent.trim().split('/');
                const partesB = b.evento.cells[3].textContent.trim().split('/');

                if (partesA.length === 3 && partesB.length === 3) {
                    valorA = new Date(+partesA[2], +partesA[1] - 1, +partesA[0]).getTime();
                    valorB = new Date(+partesB[2], +partesB[1] - 1, +partesB[0]).getTime();
                }
            }

            return ordemDistancia ? valorA - valorB : valorB - valorA;
        });

        eventosComDetalhes.forEach(item => {
            tbody.appendChild(item.evento);
            if (item.detalhes) tbody.appendChild(item.detalhes);
        });

        const seta = document.getElementById('Seta');
        if (seta) seta.textContent = ordemDistancia ? '▲' : '▼';

        if (inverter) ordemDistancia = !ordemDistancia;
    }

    /**
     * Aplica as configurações de um modelo de convite
     * @param {string} modelo - Nome do modelo (ex: 'convite01', 'convite02')
     * @returns {object} Configuração aplicada
     */
    function aplicarConfiguracaoConvite(modelo) {
        // Pega a configuração do modelo
        const config = CONVITES[modelo] || CONVITES['convite01'];
        modeloConviteAtual = modelo;
        
        // Aplica a imagem de fundo
        const container = document.getElementById('convite-container');
        container.style.backgroundImage = `url('${config.imagem}')`;
        container.style.backgroundSize = '100% 100%';
        container.style.backgroundPosition = 'center';
        container.style.backgroundRepeat = 'no-repeat';
        
        // Aplica as configurações de cada campo
        const campos = config.campos;
        const elementos = {
            ensaio: document.getElementById('DivEnsaio'),
            igreja: document.getElementById('DivIgreja'),
            hoje: document.getElementById('DivHoje'),
            data: document.getElementById('DivData'),
            hora: document.getElementById('DivHora'),
            local: document.getElementById('DivLocal')
        };
        
        for (let [nome, elemento] of Object.entries(elementos)) {
            if (elemento && campos[nome]) {
                const style = campos[nome];
                // Limpa estilos inline anteriores, mas mantém a classe
                for (let prop of ['top', 'left', 'right', 'bottom', 'transform', 'fontSize', 'fontFamily', 'color', 'textAlign', 'width', 'lineHeight', 'padding', 'wordWrap', 'fontWeight', 'textShadow', 'whiteSpace', 'letterSpacing', 'border', 'borderRadius', 'background', 'transformOrigin']) {
                    elemento.style.removeProperty(prop);
                }
                // Aplica os novos estilos
                for (let [prop, valor] of Object.entries(style)) {
                    elemento.style[prop] = valor;
                }
                // Garante que o elemento seja posicionado corretamente
                elemento.style.position = 'absolute';
                elemento.style.pointerEvents = 'none';
                
                // Se for o local, permite clique no link
                if (nome === 'local') {
                    elemento.style.pointerEvents = 'none';
                    const link = elemento.querySelector('a');
                    if (link) {
                        link.style.pointerEvents = 'auto';
                    }
                }
            }
        }
        
        // Aplica configurações dos botões
        const botoes = document.querySelector('.botoes-convite');
        if (botoes && config.botoes) {
            // Limpa estilos anteriores
            for (let prop of ['bottom', 'left', 'right', 'transform', 'gap', 'display', 'flexWrap', 'justifyContent']) {
                botoes.style.removeProperty(prop);
            }
            for (let [prop, valor] of Object.entries(config.botoes)) {
                botoes.style[prop] = valor;
            }
        }
        
        console.log(`✅ Configuração do convite "${modelo}" aplicada!`);
        return config;
    }

    /**
     * Preenche o convite com os dados e aplica o modelo
     * @param {object} dados - Dados do evento
     * @param {string} modelo - Nome do modelo (ex: 'convite01')
     */
    function preencherConvite(dados, modelo) {
        // Aplica a configuração do modelo
        const config = aplicarConfiguracaoConvite(modelo || 'convite01');
        
        // Preenche os campos com os dados
        const divIgreja = document.getElementById('DivIgreja');
        const nomeIgreja = dados.local || 'Igreja';
        divIgreja.innerHTML = nomeIgreja;
        
        // Ajusta tamanho da fonte baseado no tamanho do nome
        const textoPuro = nomeIgreja.replace(/<[^>]*>/g, '');
        const configIgreja = config.campos.igreja;
        let fontSize = configIgreja.fontSize || '46px';
        let baseSize = parseInt(fontSize);
        
        if (textoPuro.length > 30) {
            divIgreja.style.fontSize = (baseSize * 0.6) + 'px';
        } else if (textoPuro.length > 25) {
            divIgreja.style.fontSize = (baseSize * 0.7) + 'px';
        } else if (textoPuro.length > 17) {
            divIgreja.style.fontSize = (baseSize * 0.8) + 'px';
        } else {
            divIgreja.style.fontSize = fontSize;
        }
        
        // Data
        document.getElementById('DivData').textContent = dados.dataFormatada || 'Data não disponível';
        
        // Hora
        let horaTexto = dados.horario;
        if (horaTexto === 'T') horaTexto = '17:00';
        else if (horaTexto === 'T1') horaTexto = '16:30';
        else if (horaTexto === 'N') horaTexto = '19:30';
        else horaTexto = horaTexto || '19:30';
        document.getElementById('DivHora').textContent = horaTexto;
        
        // HOJE / AMANHÃ / PRÓXIMO...
        const diaTexto = getDiaTexto(dados.dataFormatada);
        document.getElementById('DivHoje').textContent = diaTexto;
        
        // Localização
        const divLocal = document.getElementById('DivLocal');
        if (dados.localizacao) {
            let linkCompleto = dados.localizacao.startsWith('http') 
                ? dados.localizacao 
                : `https://maps.app.goo.gl/${dados.localizacao}`;
            linkAtual = linkCompleto;
            divLocal.innerHTML = `🔴👇`;
        } else {
            linkAtual = '';
            divLocal.textContent = 'Local não informado';
        }
        
        // Mostra o convite
        const overlay = document.getElementById('convite-overlay');
        overlay.classList.add('ativo');
        overlay.style.display = 'flex';
    }

    function isProximosDias(dataFormatada) {
        if (!dataFormatada || dataFormatada === 'Data não disponível') return false;
        
        const partes = dataFormatada.split('/');
        if (partes.length !== 3) return false;
        
        const dataEvento = new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
        dataEvento.setHours(0, 0, 0, 0);
        
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        
        const diffTime = dataEvento.getTime() - hoje.getTime();
        const diffDias = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        return diffDias >= 0 && diffDias <= 6;
    }

    function getDiaTexto(dataFormatada) {
        if (!dataFormatada || dataFormatada === 'Data não disponível') return '';
        
        const partes = dataFormatada.split('/');
        if (partes.length !== 3) return '';
        
        const dataEvento = new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
        dataEvento.setHours(0, 0, 0, 0);
        
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        
        const diffTime = dataEvento.getTime() - hoje.getTime();
        const diffDias = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDias === 0) return 'HOJE';
        if (diffDias === 1) return 'AMANHÃ';
        
        const diasSemana = ['DOMINGO', 'SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO'];
        const nomeDia = diasSemana[dataEvento.getDay()];
        const diasFemininos = ['SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA'];
        const artigo = diasFemininos.includes(nomeDia) ? 'PRÓXIMA' : 'PRÓXIMO';
        
        return `${artigo} ${nomeDia}`;
    }

    async function gerarTabelaPorData(dataInformada) {
        await getLocation();
        document.getElementById('btn-imprimir-data').disabled = false;
        
        const checkboxes = document.querySelectorAll('input[name="cidade"]:checked');
        if (checkboxes.length === 0) { 
            alert("Nenhuma cidade foi selecionada."); 
            return; 
        }
        
        let cidades = "|";
        checkboxes.forEach((checkbox) => { cidades += `|${checkbox.value}|`; });
        
        const tabela = document.querySelector('#tabela-eventos tbody');
        tabela.innerHTML = '';
        
        const [diaStr, mesStr, anoStr] = dataInformada.split('/');
        const dia = parseInt(diaStr);
        const mes = parseInt(mesStr);
        const ano = parseInt(anoStr);
        const ultimoDia = new Date(ano, mes, 0).getDate();
        
        let encontrouEventos = false;
        let index = 0;
        
        if (typeof dados === 'undefined') {
            alert('Arquivo dados.js não carregado ou vazio.');
            return;
        }
        
        dados.forEach(item => {
            try {
                const partes = item.split(';');
                if (partes.length < 11) return;
                const [local, cidade, descricaoDia, horario, localizacao, setor, encarregadoLocal, encarregadoRegional, meses, lat, lon] = partes;
                
                if (!deveExibirMes(mes, meses)) return;
                
                let dataEvento = null;
                if (dia >= 22 && dia <= 28) {
                    if (dia + 7 > ultimoDia) {
                        dataEvento = calcularDataEvento(descricaoDia.replace("5ª", "4ª").replace("5º", "4º"), mes, ano);
                    } else {
                        dataEvento = calcularDataEvento(descricaoDia, mes, ano);
                    }
                } else {
                    dataEvento = calcularDataEvento(descricaoDia, mes, ano);
                }
                
                if (dataEvento && dataEvento.getDate() === dia && 
                    dataEvento.getMonth() === mes - 1 && 
                    dataEvento.getFullYear() === ano) {
                    if (cidades.indexOf("|"+setor+"|") > 0 || cidades.indexOf("|") > 0) {
                        LinhaPrincipal(tabela, index, local, cidade, dataInformada, horario, 
                            parseFloat(lat) || 0, parseFloat(lon) || 0, localizacao, setor, 
                            encarregadoLocal, encarregadoRegional, meses, descricaoDia);
                        CriaDetalhe(tabela, index, dataInformada, encarregadoLocal, encarregadoRegional, 
                            localizacao, descricaoDia, meses, horario);
                        index++;
                        encontrouEventos = true;
                    }
                }
            } catch (e) { console.error('Erro ao processar item:', e); }
        });
        
        if (!encontrouEventos) {
            const row = tabela.insertRow();
            const cell = row.insertCell(0);
            cell.colSpan = 5;
            cell.textContent = "Nenhum ensaio encontrado para esta data.";
            cell.className = "no-events";
        } else {
            ordemDistancia = true;
            ordenarTabelaAtual(false);
        }
    }

    async function AlteraCidade() {
        await getLocation();
        const tipoConsulta = document.querySelector('input[name="tipo-consulta"]:checked').value;
        
        const todosCheckbox = document.getElementById('marcar-desmarcar-todos');
        const checkboxes = document.querySelectorAll('input[name="cidade"]');
        if (todosCheckbox && checkboxes.length > 0) {
            const todosMarcados = Array.from(checkboxes).every(cb => cb.checked);
            todosCheckbox.checked = todosMarcados;
        }
        
        if (tipoConsulta === 'data') {
            const dataSelecionada = document.getElementById('data-select').value.split('|')[0];
            if (dataSelecionada) gerarTabelaPorData(dataSelecionada);
        } else if (tipoConsulta === 'CasaOracao') {
            consultarPorCasaOracao();
        } else if (tipoConsulta === 'encarregado-local') {
            consultarPorEncarregadoLocal();
        } else if (tipoConsulta === 'encarregado-regional') {
            gerarTabelaPorEnsaioRegional();
        }
    }

    function toggleTodos() {
        const todosCheckbox = document.getElementById('marcar-desmarcar-todos');
        const checkboxes = document.querySelectorAll('input[name="cidade"]');
        checkboxes.forEach(checkbox => { checkbox.checked = todosCheckbox.checked; });
        AlteraCidade();
    }

    function imprimirTabelaAtual() {
        try {
            const tipoConsulta = document.querySelector('input[name="tipo-consulta"]:checked').value;
            let titulo = '';
            switch(tipoConsulta) {
                case 'data': titulo = 'Ensaio Local por Data'; break;
                case 'CasaOracao': titulo = 'Ensaio Local por Casa de Oração'; break;
                case 'encarregado-local': titulo = 'Ensaio Local por Encarregado Local'; break;
                case 'encarregado-regional': titulo = 'Ensaio Regional'; break;
            }
            
            let html = `<!DOCTYPE html>
            <html><head><meta charset="UTF-8"><title>${titulo}</title>
            <style>
                body{font-family:Arial;margin:15px;font-size:12px;}
                h1{color:#2c3e50;text-align:center;margin-bottom:10px;}
                .header-info{text-align:center;margin-bottom:20px;color:#666;font-size:11px;}
                .main-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
                .main-table th{background-color:#3498db;color:#fff;padding:8px;border:1px solid #2980b9;text-align:left;}
                .main-table td{border:1px solid #ddd;padding:8px;vertical-align:top;}
                .footer{text-align:center;margin-top:30px;font-size:10px;color:#6c757d;}
            </style></head><body>
                <h1>${titulo}</h1>
                <div class="header-info">Gerado em: ${new Date().toLocaleString('pt-BR')}</div>
                <table class="main-table">
                    <tr><th>Local</th><th>Cidade</th><th>Data</th><th>Dia Ensaio</th><th>Hora</th><th>Enc Local</th><th>Enc Regional</th></tr>`;
            
            const tbody = document.querySelector('#tabela-eventos tbody');
            const linhas = tbody.querySelectorAll('tr');
            let Quantidade = 0;
            
            for (let i = 0; i < linhas.length; i++) {
                const linha = linhas[i];
                const celulas = linha.querySelectorAll('td');
                if (linha.id && linha.id.startsWith('evento-') && celulas.length >= 4) {
                    const detalhesRow = linhas[i+1];
                    const detalhesCelulas = detalhesRow ? detalhesRow.querySelectorAll('td') : [];
                    const diaEnsaio = detalhesCelulas.length > 0 && detalhesCelulas[0] ? detalhesCelulas[0].textContent : '';
                    const horaEnsaio = detalhesCelulas.length > 1 && detalhesCelulas[1] ? detalhesCelulas[1].textContent : '';
                    const encLocal = detalhesCelulas.length > 2 && detalhesCelulas[2] ? detalhesCelulas[2].textContent : '';
                    const encRegional = detalhesCelulas.length > 3 && detalhesCelulas[3] ? detalhesCelulas[3].textContent : '';
                    
                    html += `<tr><td>${celulas[0].innerHTML}</td><td>${celulas[1].innerHTML}</td><td>${celulas[3].innerHTML}</td><td>${diaEnsaio}</td><td>${horaEnsaio}</td><td>${encLocal}</td><td>${encRegional}</td></tr>`;
                    Quantidade++;
                }
            }
            
            html += `</table><div class="footer">Total de registros: ${Quantidade} | Sistema Ensaio Local</div></body></html>`;
            
            const janela = window.open('', '_blank');
            if (janela) {
                janela.document.write(html);
                janela.document.close();
                setTimeout(() => { janela.print(); }, 500);
            } else {
                alert('Pop-up bloqueado. Permita pop-ups para imprimir.');
            }
        } catch (error) {
            console.error(error);
            alert('Erro ao gerar relatório: ' + error.message);
        }
    }

    function CriaMenu() {
        if (typeof setor === 'undefined' || !setor || setor.length === 0) {
            document.getElementById('setor').innerHTML = '<p style="color:#888;">Nenhum setor disponível</p>';
            return;
        }
        
        let HTML = `
            <div class="filtro-opcao" style="border-bottom:1px solid #495057;margin-bottom:10px;padding-bottom:8px;">
                <label style="font-weight:bold;color:#fff;">
                    <input type="checkbox" id="marcar-desmarcar-todos" onclick="toggleTodos()" checked> (Des)Marcar Todos
                </label>
            </div>
        `;
        
        for (let i = 0; i < setor.length; i++) {
            let setorSplit = setor[i].split(';');
            if (setorSplit.length >= 2) {
                HTML += `<div class="filtro-opcao">
                    <label>
                        <input type="checkbox" name="cidade" value="${setorSplit[0]}" onclick="AlteraCidade()" checked> ${setorSplit[1]}
                    </label>
                </div>`;
            }
        }
        document.getElementById('setor').innerHTML = HTML;
    }

    // ============================================================
    // EVENTOS E INICIALIZAÇÃO
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
        // Carrega o popup de boas-vindas (se existir)
        if (typeof carregarPopup === 'function') {
            setTimeout(carregarPopup, 500);
        }
        
        preencherSelectDatas();

        // Eventos do convite
        document.getElementById('btn-fechar-convite').addEventListener('click', fecharConvite);
        document.getElementById('btn-fechar').addEventListener('click', fecharConvite);
        document.getElementById('convite-overlay').addEventListener('click', function(e) {
            if (e.target === this) fecharConvite();
        });
        
        // Botão Compartilhar
        document.getElementById('btn-compartilhar').addEventListener('click', function(e) {
            e.stopPropagation();
            compartilharWhatsApp();
        });

        // Radios
        document.querySelectorAll('input[name="tipo-consulta"]').forEach(radio => {
            radio.addEventListener('change', alternarTipoConsulta);
        });

        // Botões de consulta
        document.getElementById('btn-listar').addEventListener('click', function() {
            const dataSelecionada = document.getElementById('data-select').value.split('|')[0];
            if (dataSelecionada) gerarTabelaPorData(dataSelecionada);
        });
        document.getElementById('btn-consultar-casa-oracao').addEventListener('click', consultarPorCasaOracao);
        document.getElementById('btn-consultar-encarregado-local').addEventListener('click', consultarPorEncarregadoLocal);
        document.getElementById('btn-consultar-encarregado-regional').addEventListener('click', gerarTabelaPorEnsaioRegional);

        // Enter
        document.getElementById('casa-oracao-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') consultarPorCasaOracao();
        });
        document.getElementById('encarregado-local-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') consultarPorEncarregadoLocal();
        });
        document.getElementById('encarregado-regional-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') gerarTabelaPorEnsaioRegional();
        });

        // Imprimir
        document.getElementById('btn-imprimir-data').addEventListener('click', imprimirTabelaAtual);
        document.getElementById('btn-imprimir-casa-oracao').addEventListener('click', imprimirTabelaAtual);
        document.getElementById('btn-imprimir-encarregado-local').addEventListener('click', imprimirTabelaAtual);
        document.getElementById('btn-imprimir-ensaio-regional').addEventListener('click', imprimirTabelaAtual);

        // Data select
        document.getElementById('data-select').addEventListener('change', function(e) {
            if (document.getElementById('consulta-data').checked) {
                const dataSelecionada = e.target.value.split('|')[0];
                if (dataSelecionada) gerarTabelaPorData(dataSelecionada);
            }
        });

        // Seta
        document.getElementById('Seta').addEventListener('click', trocaSeta);

        // Menu
        const menuBtn = document.getElementById('menu-btn');
        const overlayMenu = document.getElementById('overlay');
        function toggleMenu() {
            document.body.classList.toggle('menu-aberto');
        }
        menuBtn.addEventListener('click', toggleMenu);
        overlayMenu.addEventListener('click', toggleMenu);

        CriaMenu();

        (async function inicializarTabela() {
            await initApp();
            const dataSelecionada = document.getElementById('data-select').value.split('|')[0];
            if (dataSelecionada) await gerarTabelaPorData(dataSelecionada);
        })();
    });

    async function initApp() {
        try {
            await getLocation();
        } catch (error) {
            console.error('Erro ao obter localização:', error);
            usarLocalizacaoPadrao();
        }
    }

    // ============================================================
    // EXPORTAÇÃO PARA O GLOBAL
    // ============================================================

    window.trocaSeta = trocaSeta;
    window.toggleDetalhes = toggleDetalhes;
    window.abrirMaps = abrirMaps;
    window.abrirConvite = abrirConvite;
    window.fecharConvite = fecharConvite;
    window.AlteraCidade = AlteraCidade;
    window.toggleTodos = toggleTodos;
    window.imprimirTabelaAtual = imprimirTabelaAtual;
    window.gerarTabelaPorData = gerarTabelaPorData;
    window.consultarPorCasaOracao = consultarPorCasaOracao;
    window.consultarPorEncarregadoLocal = consultarPorEncarregadoLocal;
    window.gerarTabelaPorEnsaioRegional = gerarTabelaPorEnsaioRegional;
    window.compartilharWhatsApp = compartilharWhatsApp;
    window.aplicarConfiguracaoConvite = aplicarConfiguracaoConvite;
    window.preencherConvite = preencherConvite;
    window.CONVITES = CONVITES;
    </script>
</body>
