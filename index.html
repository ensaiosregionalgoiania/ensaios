// Substitua a função getPrimeiroNome por esta versão:

function getPrimeiroNome(nomeCompleto) {
    if (!nomeCompleto) return '';
    const nomeTrim = nomeCompleto.trim();
    
    // Verifica se há texto entre parênteses
    const regexParenteses = /\(([^)]+)\)/;
    const match = nomeTrim.match(regexParenteses);
    
    // Se encontrar algo entre parênteses, usa esse texto
    if (match && match[1]) {
        return match[1].trim();
    }
    
    // Se não houver parênteses, mantém a lógica original
    const partes = nomeTrim.split(' ');
    if (partes.length === 1) return partes[0];
    
    const conectores = ['DA', 'DE', 'DO', 'DAS', 'DOS', 'E', 'A', 'O', 'AS', 'OS', 'COM', 'SEM', 'POR', 'PARA', 'PRA'];
    
    let primeiro = partes[0];
    let segundo = null;
    
    for (let i = 1; i < partes.length; i++) {
        const palavra = partes[i].toUpperCase();
        if (!conectores.includes(palavra) && palavra.length > 2) {
            segundo = partes[i];
            break;
        }
    }
    
    if (segundo) {
        return primeiro + ' ' + segundo;
    }
    return primeiro;
}

        async function gerarProximoId() {
            try {
                const snapshot = await membrosCollection.get();
                let maiorId = 0;
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.id && !isNaN(Number(data.id))) {
                        const idNum = Number(data.id);
                        if (idNum > maiorId) {
                            maiorId = idNum;
                        }
                    }
                });
                
                const proximoId = maiorId + 1;
                console.log(`Próximo ID disponível: ${proximoId}`);
                return proximoId;
                
            } catch(error) {
                console.error('Erro ao gerar próximo ID:', error);
                return Date.now();
            }
        }

        async function verificarECorrigirMembrosSemId() {
            console.log("=== VERIFICANDO MEMBROS SEM ID ===");
            
            try {
                const snapshot = await membrosCollection.get();
                let corrigidos = 0;
                
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    
                    if (!data.id || data.id === '' || data.id === undefined || data.id === null) {
                        console.log(`⚠️ Membro sem ID encontrado: ${data.nome} (Doc: ${doc.id})`);
                        
                        const novoId = await gerarProximoId();
                        
                        await membrosCollection.doc(doc.id).update({
                            id: novoId
                        });
                        
                        console.log(`✅ Corrigido: ${data.nome} recebeu ID ${novoId}`);
                        corrigidos++;
                    }
                }
                
                if (corrigidos > 0) {
                    console.log(`✅ Total de membros corrigidos: ${corrigidos}`);
                    mostrarToast(`✅ ${corrigidos} membros foram corrigidos com ID automático`, 'success');
                } else {
                    console.log("✅ Todos os membros já possuem ID");
                }
                
                await carregarMembros();
                
            } catch(error) {
                console.error('Erro ao verificar membros sem ID:', error);
            }
        }

                nivelSelect.innerHTML = '<option value="">Selecione...</option>';
                for (let i = 0; i < niveis.length; i++) {
                    nivelSelect.innerHTML += '<option value="' + niveis[i].id + '">' + niveis[i].nome + '</option>';
                }
            }
        }

        async function carregarDados() {
            console.log("Carregando dados do Firebase...");
            
            try {
                const instSnap = await instrumentosCollection.get();
                instrumentos = [];
                instSnap.forEach(doc => {
                    const data = doc.data();
                    instrumentos.push({ id: data.id, nome: data.nome });
                });
                instrumentos.sort((a, b) => a.id - b.id);
                console.log("Instrumentos carregados:", instrumentos.length);

                const congSnap = await congregacoesCollection.get();
                congregacoes = [];
                
                console.log("Total de congregações no Firestore:", congSnap.size);
                console.log("ID do usuário (número):", congregacoesIdUsuario);
                
                for (const doc of congSnap.docs) {
                    const data = doc.data();
                    const congregacao = { 
                        docId: doc.id,
                        id: data.id,
                        nome: data.nome, 
                        cidade: data.cidade || ""
                    };
                    
                    if (congregacoesIdUsuario && congregacoesIdUsuario !== 0 && congregacoesIdUsuario !== '0') {
                        if (String(data.id) === String(congregacoesIdUsuario)) {
                            congregacoes.push(congregacao);
                            console.log("✅ Congregação permitida:", congregacao.nome, "(Número:", data.id, ")");
                        }
                    } else {
                        congregacoes.push(congregacao);
                    }
                }
                
                console.log("Congregações carregadas:", congregacoes.length);

                const cargoSnap = await cargosCollection.get();
                cargos = [];
                cargoSnap.forEach(doc => {
                    const data = doc.data();
                    cargos.push({ id: data.id, nome: data.nome });
                });
                cargos.sort((a, b) => a.id - b.id);
                console.log("Cargos carregados:", cargos.length);

                const nivelSnap = await niveisCollection.get();
                niveis = [];
                nivelSnap.forEach(doc => {
                    const data = doc.data();
                    niveis.push({ id: data.id, nome: data.nome, descricao: data.descricao || '' });
                });
                niveis.sort((a, b) => a.id - b.id);
                console.log("Níveis carregados:", niveis.length);

                await carregarMembros();
                popularSelects();
                
            } catch(error) {
                console.error("Erro ao carregar dados:", error);
                mostrarToast("Erro ao carregar dados: " + error.message, "error");
            }
        }

        async function carregarMembros() {
            console.log("Carregando membros...");
            
            try {
                let query = membrosCollection;
                
                if (congregacoesIdUsuario && congregacoesIdUsuario !== 0 && congregacoesIdUsuario !== '0') {
                    console.log(`Filtrando membros pelo ID numérico: ${congregacoesIdUsuario}`);
                    query = membrosCollection.where('congregacaoId', '==', String(congregacoesIdUsuario));
                }
                
                const snap = await query.get();
                membros = [];
                
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.nome) {
                        membros.push({
                            docId: doc.id,
                            nomeId: data.id,
                            nome: data.nome || '',
                            instrumentoId: data.instrumentoId || data.instrumento || 0,
                            congregacaoId: data.congregacaoId || data.congregacao || '',
                            cargoId: data.cargoId || data.cargo || 0,
                            nivelId: data.nivelId || data.nivel || 0
                        });
                    }
                });
                
                console.log(`Total de membros carregados: ${membros.length}`);
                if (membros.length > 0) {
                    console.log("Membros encontrados:", membros.map(m => `${m.nome} (cong: ${m.congregacaoId})`));
                }
                
                const contadorSpan = document.getElementById('contadorMembros');
                if (contadorSpan) contadorSpan.textContent = membros.length;
                
                if (membros.length === 0) {
                    let mensagemVazio = '📭 Nenhum membro cadastrado ainda. Clique em "Novo Membro" para adicionar.';
                    if (congregacoesIdUsuario && congregacoesIdUsuario !== 0) {
                        mensagemVazio = `📭 Nenhum membro cadastrado na congregação com ID ${congregacoesIdUsuario}. Clique em "Novo Membro" para adicionar.`;
                    }
                    document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="7" class="loading">${mensagemVazio}</td></tr>`;
                } else {
                    renderizarTabela();
                }
                
            } catch(error) {
                console.error("Erro ao carregar membros:", error);
                document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="7" class="loading">❌ Erro ao carregar membros: ${error.message}</td></tr>`;
            }
        }

        function renderizarTabela() {
            const busca = document.getElementById('busca').value.toLowerCase();
            const filtrados = membros.filter(m => m.nome.toLowerCase().includes(busca));
            const tbody = document.getElementById('corpoTabela');
            
            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">🔍 Nenhum membro encontrado com este nome</td></tr>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < filtrados.length; i++) {
                const m = filtrados[i];
                const congregacao = congregacoes.find(c => String(c.id) === String(m.congregacaoId));
                const congregacaoTexto = congregacao ? `${congregacao.nome}${congregacao.cidade ? ` (${congregacao.cidade})` : ''}` : (m.congregacaoId || '?');
                const instrumentoTexto = getInstrumentoNome(m.instrumentoId);
                const idTexto = m.nomeId || '-';
                
                html += '<tr>';
                html += '<td><strong>' + idTexto + '</strong></td>';
                html += '<td><strong>' + m.nome + '</strong></td>';
                html += '<td>' + instrumentoTexto + '</td>';
                html += '<td>' + congregacaoTexto + '</td>';
                html += '<td>' + getNome(cargos, m.cargoId) + '</td>';
                html += '<td>' + getNome(niveis, m.nivelId) + '</td>';
                html += '<td>';
                html += '<button class="btn-edit" onclick="editarMembro(\'' + m.docId + '\')">✏️ Editar</button> ';
                html += '<button class="btn-danger" onclick="abrirModalExcluir(\'' + m.docId + '\', \'' + m.nome.replace(/'/g, "\\'") + '\')">🗑️ Excluir</button>';
                html += '</td>';
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }

        function abrirFormularioNovo() {
            document.getElementById('formTitle').innerHTML = '➕ Adicionar Membro';
            document.getElementById('membroDocId').value = '';
            document.getElementById('membroIdHidden').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('instrumentoId').value = '';
            
            const congSelect = document.getElementById('congregacaoId');
            if (!congSelect.disabled) {
                congSelect.value = '';
            }
            
            document.getElementById('cargoId').value = '';
            document.getElementById('nivelId').value = '';
            document.getElementById('qrArea').style.display = 'none';
            document.getElementById('btnGerarQRCode').style.display = 'none';
            document.getElementById('idInfo').style.display = 'none';
            document.getElementById('cardLista').style.display = 'none';
            document.getElementById('cardFormulario').style.display = 'block';
        }

        function cancelarEdicao() {
            document.getElementById('cardLista').style.display = 'block';
            document.getElementById('cardFormulario').style.display = 'none';
            carregarMembros();
        }

        function editarMembro(docId) {
            const membro = membros.find(m => m.docId === docId);
            if (membro) {
                document.getElementById('formTitle').innerHTML = '✏️ Editar Membro';
                document.getElementById('membroDocId').value = membro.docId;
                document.getElementById('membroIdHidden').value = membro.nomeId || '';
                document.getElementById('nome').value = membro.nome;
                document.getElementById('qrArea').style.display = 'none';
                document.getElementById('btnGerarQRCode').style.display = 'inline-block';
                
                if (membro.nomeId) {
                    document.getElementById('idInfo').style.display = 'block';
                    document.getElementById('displayMembroId').textContent = membro.nomeId;
                } else {
                    document.getElementById('idInfo').style.display = 'none';
                }
                
                document.getElementById('cardLista').style.display = 'none';
                document.getElementById('cardFormulario').style.display = 'block';
                
                setTimeout(function() {
                    document.getElementById('instrumentoId').value = membro.instrumentoId;
                    
                    const congSelect = document.getElementById('congregacaoId');
                    if (!congSelect.disabled) {
                        congSelect.value = membro.congregacaoId;
                    }
                    
                    document.getElementById('cargoId').value = membro.cargoId;
                    document.getElementById('nivelId').value = membro.nivelId;
                }, 100);
                
                const btnGerar = document.getElementById('btnGerarQRCode');
                const novoBtn = btnGerar.cloneNode(true);
                btnGerar.parentNode.replaceChild(novoBtn, btnGerar);
                novoBtn.style.display = 'inline-block';
                novoBtn.onclick = function() { mostrarQRCode(membro.docId); };
            } else {
                mostrarToast('❌ Membro não encontrado!');
            }
        }

        function gerarQRCodeIndividual(membroId, membroNome, membroNomeId, instrumentoNome) {
            return new Promise((resolve) => {
                const container = document.createElement('div');
                container.style.width = '150px';
                container.style.height = '150px';
                
                const dadosQR = JSON.stringify({ id: membroNomeId });
                
                try {
                    new QRCode(container, {
                        text: dadosQR,
                        width: 150,
                        height: 150,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    
                    setTimeout(() => {
                        const canvas = container.querySelector('canvas');
                        if (canvas) {
                            const finalCanvas = document.createElement('canvas');
                            const ctx = finalCanvas.getContext('2d');
                            
                            const qrSize = 150;
                            const padding = 10;
                            let alturaTexto = 40;
                            
                            let instrumentoExibicao = instrumentoNome;
                            if (instrumentoExibicao && instrumentoExibicao.toLowerCase() === 'orgao') {
                                instrumentoExibicao = 'Órgão';
                            }
                            
                            if (instrumentoExibicao && instrumentoExibicao.toLowerCase() !== 'nao tem' && instrumentoExibicao.toLowerCase() !== 'não tem') {
                                alturaTexto = 60;
                            }
                            
                            finalCanvas.width = qrSize + (padding * 2);
                            finalCanvas.height = qrSize + (padding * 2) + alturaTexto;
                            
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                            
                            ctx.drawImage(canvas, padding, padding, qrSize, qrSize);
                            
                            const nomeExibido = getPrimeiroNome(membroNome);
                            ctx.font = 'bold 14px "Segoe UI", Arial';
                            ctx.fillStyle = '#2c3e50';
                            ctx.textAlign = 'center';
                            ctx.fillText(nomeExibido, finalCanvas.width / 2, qrSize + padding + 25);
                            
                            let yOffset = qrSize + padding + 40;
                            
                            if (instrumentoExibicao && instrumentoExibicao.toLowerCase() !== 'nao tem' && instrumentoExibicao.toLowerCase() !== 'não tem') {
                                ctx.font = 'italic 11px "Segoe UI", Arial';
                                ctx.fillStyle = '#27ae60';
                                ctx.fillText(`🎵 ${instrumentoExibicao}`, finalCanvas.width / 2, yOffset);
                            }
                            
                            resolve(finalCanvas.toDataURL('image/png'));
                        } else {
                            resolve(null);
                        }
                    }, 300);
                } catch(error) {
                    console.error('Erro ao gerar QR Code:', error);
                    resolve(null);
                }
            });
        }

        async function mostrarQRCode(membroDocId) {
            const membro = membros.find(m => m.docId === membroDocId);
            if (!membro) {
                mostrarToast('❌ Membro não encontrado!');
                return;
            }
            
            if (!membro.nomeId) {
                mostrarToast('⚠️ Este membro não possui ID. Salve o membro novamente para gerar o ID.', 'warning');
                return;
            }
            
            const instrumento = instrumentos.find(i => i.id == membro.instrumentoId);
            const instrumentoNome = instrumento ? instrumento.nome : null;
            
            document.getElementById('qrArea').style.display = 'block';
            document.getElementById('qrCodeImage').innerHTML = '<div class="loading">Gerando QR Code...</div>';
            
            const imgData = await gerarQRCodeIndividual(membro.docId, membro.nome, membro.nomeId, instrumentoNome);
            
            if (imgData) {
                document.getElementById('qrCodeImage').innerHTML = '<img src="' + imgData + '" style="max-width:200px;">';
                window.qrCodeData = imgData;
            } else {
                document.getElementById('qrCodeImage').innerHTML = '<div class="loading">❌ Erro ao gerar QR Code</div>';
            }
        }

        function baixarQRCode() {
            if (window.qrCodeData) {
                const link = document.createElement('a');
                const membroNome = document.getElementById('nome').value;
                const primeiroNome = getPrimeiroNome(membroNome);
                link.download = 'qrcode_' + primeiroNome + '.png';
                link.href = window.qrCodeData;
                link.click();
                mostrarToast('✅ QR Code baixado!');
            } else {
                mostrarToast('❌ Gere o QR Code primeiro');
            }
        }

        document.getElementById('formMembro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const docId = document.getElementById('membroDocId').value;
            
            let congregacaoId = document.getElementById('congregacaoId').value;
            if (!congregacaoId && congregacoesIdUsuario && congregacoesIdUsuario !== 0) {
                if (congregacoes.length > 0) {
                    congregacaoId = String(congregacoes[0].id);
                } else {
                    congregacaoId = String(congregacoesIdUsuario);
                }
            }
            
            try {
                if (docId) {
                    const membroExistente = membros.find(m => m.docId === docId);
                    const dados = {
                        nome: document.getElementById('nome').value,
                        instrumentoId: parseInt(document.getElementById('instrumentoId').value),
                        congregacaoId: congregacaoId,
                        cargoId: parseInt(document.getElementById('cargoId').value),
                        nivelId: parseInt(document.getElementById('nivelId').value),
                        atualizadoEm: new Date().toISOString()
                    };
                    
                    if (membroExistente && membroExistente.nomeId) {
                        dados.id = membroExistente.nomeId;
                    }
                    
                    await membrosCollection.doc(docId).update(dados);
                    mostrarToast('✅ Membro atualizado!');
                    
                } else {
                    const novoId = await gerarProximoId();
                    
                    const dados = {
                        id: novoId,
                        nome: document.getElementById('nome').value,
                        instrumentoId: parseInt(document.getElementById('instrumentoId').value),
                        congregacaoId: congregacaoId,
                        cargoId: parseInt(document.getElementById('cargoId').value),
                        nivelId: parseInt(document.getElementById('nivelId').value),
                        criadoEm: new Date().toISOString(),
                        atualizadoEm: new Date().toISOString()
                    };
                    
                    console.log(`➕ Adicionando novo membro com ID: ${novoId}, Congregação: ${congregacaoId}`);
                    await membrosCollection.add(dados);
                    mostrarToast(`✅ Membro adicionado! ID: ${novoId}`);
                }
                
                cancelarEdicao();
                
            } catch(error) {
                console.error('Erro ao salvar:', error);
                mostrarToast('❌ Erro: ' + error.message, 'error');
            }
        });

        document.getElementById('btnBaixarQRCode').addEventListener('click', baixarQRCode);

        function abrirModalExcluir(docId, nome) {
            membroParaExcluir = docId;
            document.getElementById('modalMsg').innerHTML = 'Excluir <strong>' + nome + '</strong>?';
            document.getElementById('modalExcluir').style.display = 'flex';
        }
        
        function fecharModalExcluir() {
            document.getElementById('modalExcluir').style.display = 'none';
            membroParaExcluir = null;
        }
        
        async function confirmarExclusao() {
            if (membroParaExcluir) {
                await membrosCollection.doc(membroParaExcluir).delete();
                mostrarToast('✅ Membro excluído!');
                fecharModalExcluir();
                carregarMembros();
            }
        }

        function filtrarMembros() { renderizarTabela(); }

        async function inicializarSistema() {
            console.log("🚀 Inicializando sistema de manutenção...");
            
            if (papelUsuario === 'Secretário') {
                console.log("🔒 Usuário Secretário - redirecionando para presenca.html");
                window.location.href = 'presenca.html';
                return;
            }
            
            console.log("👑 Usuário Administrador - carregando sistema");
            await carregarDados();
            await verificarECorrigirMembrosSemId();
            console.log("✅ Sistema inicializado!");
        }

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const adminDoc = await db.collection("administradores").doc(user.uid).get();
                
                if (!adminDoc.exists || !adminDoc.data().ativo) {
                    await auth.signOut();
                    window.location.href = 'login.html';
                    return;
                }
                
                const adminData = adminDoc.data();
                
                papelUsuario = adminData.papel || 'Administrador';
                
                usuarioLogado = {
                    uid: user.uid,
                    email: user.email,
                    nome: adminData.nome || 'Administrador',
                    congregacoes_id: adminData.congregacoes_id || 0,
                    papel: papelUsuario
                };
                
                congregacoesIdUsuario = usuarioLogado.congregacoes_id;
                
                if (papelUsuario === 'Secretário') {
                    console.log("🔒 Usuário Secretário - redirecionando para presenca.html");

                    return;

                        btnInstrumento.style.display = 'inline-block';
                    }

                        btnNivel.classList.remove('hidden');
                        btnNivel.style.display = 'inline-block';
                    }
                    console.log("✅ Botões 'Cadastrar Instrumento' e 'Cadastrar Níveis' visíveis (acesso total)");
                } else {
                    // Acesso restrito - oculta os botões

                        btnInstrumento.classList.add('hidden');
                        btnInstrumento.style.display = 'none';
                    }
                    if (btnNivel) {
                        btnNivel.classList.add('hidden');

                    }

                console.error('Erro ao verificar admin:', error);
                window.location.href = 'login.html';
            }
        });
